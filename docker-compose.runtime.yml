services:
  cerebro-runtime:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    environment:
      PROJETO_ABSOLUTO_EXECUTOR_CMD: ${PROJETO_ABSOLUTO_EXECUTOR_CMD:?defina o executor autorizado}
      PROJETO_ABSOLUTO_WORKER_INTERVALO: ${PROJETO_ABSOLUTO_WORKER_INTERVALO:-60}
      PROJETO_ABSOLUTO_WORKER_MAX_CICLOS: ${PROJETO_ABSOLUTO_WORKER_MAX_CICLOS:-}
    volumes:
      - cerebro-data:/app/cerebro/data

volumes:
  cerebro-data:
