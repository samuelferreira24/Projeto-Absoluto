name: Análise Documental — Alto Rendimento

on:
  workflow_dispatch:
  push:
    branches: [base-cerebro-v0.1]
    paths:
      - '**/*.docx'
      - '**/*.pdf'
      - '**/*.mht'
      - '**/*.mhtml'
      - '**/*.md'
      - '**/*.txt'
      - 'cerebro/analisador_documentos.py'

permissions:
  contents: write

concurrency:
  group: cerebro-analise-documental-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install --upgrade pip pytest pypdf

      - name: Testar analisador
        run: pytest -q cerebro/tests/test_analisador_documentos.py

      - name: Analisar arquivos do Projeto
        run: |
          mkdir -p cerebro/data/analise
          python - <<'PY'
          from cerebro.analisador_documentos import salvar_relatorio
          resultado = salvar_relatorio('.', 'cerebro/data/analise/inventario_documental.json')
          print({
              'documentos': resultado['quantidade_documentos'],
              'palavras': resultado['total_palavras'],
              'caracteres': resultado['total_caracteres'],
              'erros_extracao': len(resultado['erros_extracao']),
          })
          PY

      - name: Publicar evidência
        uses: actions/upload-artifact@v4
        with:
          name: analise-documental-${{ github.run_id }}
          path: cerebro/data/analise/inventario_documental.json
          retention-days: 30

      - name: Persistir inventário
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cerebro/data/analise/inventario_documental.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração no inventário.'
          else
            git commit -m 'chore(cerebro): atualizar inventário documental'
            git push
          fi
