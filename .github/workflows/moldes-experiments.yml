name: Moldes Experiments
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["experimento-02-validacao-prototipos"]
jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: pytest -q experimentos/01_moldes_execucao
      - run: PYTHONPATH=. pytest -q experimentos/03_sombra_abs
      - run: PYTHONPATH=.:${{ github.workspace }}/experimentos/04_planejamento_sombra pytest -q experimentos/04_planejamento_sombra
      - run: PYTHONPATH=.:${{ github.workspace }}/experimentos/02_validacao_prototipos pytest -q experimentos/05_combinatorio
      - run: PYTHONPATH=.:${{ github.workspace }}/experimentos/06_prototipo_executavel pytest -q experimentos/06_prototipo_executavel
      - run: PYTHONPATH=.:${{ github.workspace }}/experimentos/07_sandbox_runtime pytest -q experimentos/07_sandbox_runtime
