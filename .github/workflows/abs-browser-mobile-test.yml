name: ABS Browser Mobile Zoom Smoke Test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-browser-mobile-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 121 &&
      github.event.comment.user.login == 'samuelferreira24' &&
      github.event.comment.body == '/abs-browser mobile-test'
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 5
    steps:
      - name: Verify injected touch zoom controls without changing user tabs
        id: test
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/abs-browser-mobile-test.txt"
          install -m 600 /dev/null "$REPORT"
          exec > >(tee -a "$REPORT") 2>&1
          pass(){ printf 'PASS | %s\n' "$*"; }
          fail(){ printf 'FAIL | %s\n' "$*"; }
          trap 'rc=$?; { echo "result<<ABS_MOBILE_TEST_EOF"; tail -c 7000 "$REPORT"; echo; echo "ABS_MOBILE_TEST_EOF"; } >> "$GITHUB_OUTPUT"; exit "$rc"' EXIT

          [ "$(hostname)" = "abs-vps-01" ] || { fail "Unexpected host."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:8787/health >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:9222/json/version >/dev/null
          command -v node >/dev/null
          node -e 'if (typeof WebSocket !== "function") process.exit(1)' || { fail "Node WebSocket API unavailable; browser was not changed."; exit 1; }

          node <<'NODE'
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          const connect = url => new Promise((resolve, reject) => {
            const ws = new WebSocket(url);
            ws.addEventListener("open", () => resolve(ws), {once:true});
            ws.addEventListener("error", () => reject(new Error("CDP websocket connection failed")), {once:true});
          });
          function rpc(ws) {
            let id = 0;
            const pending = new Map();
            ws.addEventListener("message", event => {
              let msg;
              try { msg = JSON.parse(event.data); } catch { return; }
              if (!msg.id || !pending.has(msg.id)) return;
              const p = pending.get(msg.id); pending.delete(msg.id);
              if (msg.error) p.reject(new Error(msg.error.message));
              else p.resolve(msg.result || {});
            });
            return (method, params={}) => new Promise((resolve,reject) => {
              const next = ++id;
              pending.set(next,{resolve,reject});
              ws.send(JSON.stringify({id:next,method,params}));
              setTimeout(() => { if (pending.has(next)) { pending.delete(next); reject(new Error("CDP timeout: "+method)); } }, 5000);
            });
          }
          (async () => {
            let browserWs, pageWs, targetId;
            try {
              const version = await fetch("http://127.0.0.1:9222/json/version").then(r => r.json());
              browserWs = await connect(version.webSocketDebuggerUrl);
              const browserRpc = rpc(browserWs);
              const created = await browserRpc("Target.createTarget",{url:"https://example.com",background:true});
              targetId = created.targetId;
              let tab;
              for (let i=0;i<20;i++) {
                const tabs = await fetch("http://127.0.0.1:9222/json/list").then(r=>r.json());
                tab = tabs.find(t=>t.id===targetId && t.webSocketDebuggerUrl);
                if (tab) break;
                await wait(250);
              }
              if (!tab) throw new Error("Temporary test tab did not appear");
              pageWs = await connect(tab.webSocketDebuggerUrl);
              const pageRpc = rpc(pageWs);
              await pageRpc("Runtime.enable");
              let state;
              for (let i=0;i<20;i++) {
                await wait(250);
                const v = await pageRpc("Runtime.evaluate",{expression:"({ready:document.readyState,host:!!document.querySelector('#__abs_mobile_zoom_host'),buttons:document.querySelector('#__abs_mobile_zoom_host')?.shadowRoot?.querySelectorAll('button').length||0,width:innerWidth})",returnByValue:true});
                state = v.result.value;
                if (state.host && state.buttons === 4) break;
              }
              if (!state || !state.host || state.buttons !== 4) throw new Error("Zoom controls did not inject into a fresh web tab: "+JSON.stringify(state));
              const before = state.width;
              await pageRpc("Runtime.evaluate",{expression:"document.querySelector('#__abs_mobile_zoom_host').shadowRoot.querySelector('[data-action=in]').click()"});
              await wait(700);
              const afterResult = await pageRpc("Runtime.evaluate",{expression:"({width:innerWidth,host:!!document.querySelector('#__abs_mobile_zoom_host')})",returnByValue:true});
              const after = afterResult.result.value.width;
              console.log("PASS | Extension injected into a temporary background tab; controls=4; viewport width before="+before+" after="+after);
              console.log("PASS | Zoom control click was dispatched; tab zoom API is exercised without navigating the user's existing tab.");
              await browserRpc("Target.closeTarget",{targetId});
              targetId = null;
            } catch (e) {
              console.error("FAIL | "+e.message);
              process.exitCode = 1;
            } finally {
              if (pageWs) try { pageWs.close(); } catch {}
              if (browserWs) {
                try { if (targetId) await rpc(browserWs)("Target.closeTarget",{targetId}); } catch {}
                try { browserWs.close(); } catch {}
              }
            }
          })();
          NODE
          pass "Mobile zoom smoke test completed."
          curl -fsS --max-time 5 http://127.0.0.1:8787/health >/dev/null
          pass "ABS health remains available."

      - name: Publish sanitized report
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.test.outputs.result }}
        with:
          script: |
            const body = [
              '### ABS BROWSER MOBILE TEST — REPORT',
              '',
              (process.env.RESULT || 'No final report produced; inspect the private Actions logs.').slice(0, 7000),
              '',
              'No browser credentials are included.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
