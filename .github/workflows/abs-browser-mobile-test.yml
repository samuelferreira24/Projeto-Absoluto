name: ABS Browser Mobile Interaction Smoke Test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-browser-mobile-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 121 &&
      github.event.comment.user.login == 'samuelferreira24' &&
      github.event.comment.body == '/abs-browser mobile-test'
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 5
    steps:
      - name: Verify live native-touch assets and browser health
        id: test
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/abs-browser-mobile-test.txt"
          install -m 600 /dev/null "$REPORT"
          exec > >(tee -a "$REPORT") 2>&1
          pass(){ printf 'PASS | %s\n' "$*"; }
          fail(){ printf 'FAIL | %s\n' "$*"; }
          trap 'rc=$?; { echo "result<<ABS_MOBILE_TEST_EOF"; tail -c 7000 "$REPORT"; echo; echo "ABS_MOBILE_TEST_EOF"; } >> "$GITHUB_OUTPUT"; exit "$rc"' EXIT

          [ "$(hostname)" = "abs-vps-01" ] || { fail "Unexpected host."; exit 1; }
          [ "$(sudo -n docker inspect abs-browser-ui --format '{{.State.Status}}')" = "running" ] || { fail "Browser container is not running."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:8787/health >/dev/null || { fail "ABS health unavailable."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:9222/json/version >/dev/null || { fail "Chromium DevTools unavailable."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:9223/health >/dev/null || { fail "Private keyboard bridge health unavailable."; exit 1; }

          CORE="$(sudo -n docker exec abs-browser-ui sh -lc 'find /lsiopy/lib/python3.13/site-packages/selkies/selkies_web/assets -maxdepth 1 -type f -name "selkies-core-*.js" | head -n 1')"
          DASH="$(sudo -n docker exec abs-browser-ui sh -lc 'find /lsiopy/lib/python3.13/site-packages/selkies/selkies_web/assets -maxdepth 1 -type f -name "index-*.js" | head -n 1')"
          [ -n "$CORE" ] && [ -n "$DASH" ] || { fail "Could not locate active Selkies bundles."; exit 1; }
          sudo -n docker exec abs-browser-ui grep -q 'ABS_MOBILE_TOUCH_GESTURES_V1' "$CORE" || { fail "Active core bundle lacks native touch gesture marker."; exit 1; }
          sudo -n docker exec abs-browser-ui grep -q 'ABS_MOBILE_AUTO_KEYBOARD_V1' "$DASH" || { fail "Active dashboard bundle lacks keyboard assistance marker."; exit 1; }
          sudo -n docker exec abs-browser-ui grep -q 'ABS_MOBILE_FOCUS_BRIDGE_V1' "$DASH" || { fail "Active dashboard bundle lacks webpage focus bridge marker."; exit 1; }
          ARGS="$(sudo -n docker exec abs-browser-ui sh -lc 'ps -eo args | grep -E "[c]hromium" | head -n 2')"
          printf '%s\n' "$ARGS" | grep -F -- '--enable-touch-events' >/dev/null || { fail "Chromium touch events are not enabled."; exit 1; }
          if printf '%s\n' "$ARGS" | grep -F -- '--load-extension=/config/abs-mobile-zoom' >/dev/null; then
            fail "Legacy floating zoom extension is still loaded."; exit 1
          fi
          pass "Live core bundle includes native scroll/pinch implementation."
          pass "Live dashboard bundle includes keyboard assistance and page-focus bridge."
          pass "Chromium touch events enabled; legacy extension is absent."
          pass "ABS, Chromium DevTools and private keyboard bridge health checks passed."
          echo "LIMIT | This is a server-side smoke test, not proof of physical Android keyboard or gesture behavior."
      - name: Publish sanitized report
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.test.outputs.result }}
        with:
          script: |
            const body = [
              '### ABS BROWSER MOBILE INTERACTION SMOKE TEST — REPORT',
              '',
              (process.env.RESULT || 'No final report produced; inspect the private Actions logs.').slice(0, 7000),
              '',
              'No browser credentials are included.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
