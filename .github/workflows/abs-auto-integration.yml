name: ABS Automatic Integration Validation

on:
  push:
    branches: [main]
    paths:
      - 'abs_core/**'
      - 'tests/**'
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: abs-auto-integration
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 15
    steps:
      - name: Validate ABS on reserve VPS
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/Projeto-Absoluto"
          git fetch origin main --quiet
          git reset --hard origin/main --quiet
          python3 -m compileall -q abs_core
          python3 -m pytest -q tests
          health="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
          v3="$(curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status)"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("status") == "alive", d' "$health"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("version") == "v3", d' "$v3"
          echo "ABS_AUTO_INTEGRATION_PASS"
          echo "$health"
          echo "$v3"

  cleanup-queue:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'samuelferreira24' &&
      github.event.comment.body == '/abs runner-clean-queue'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale runner jobs
        uses: actions/github-script@v7
        with:
          script: |
            const targets = new Set([
              'ABS Local AI Health',
              'ABS VPS Reserve Channel',
              'ABS Automatic Integration Validation',
              'ABS VPS Command Channel'
            ]);
            const canceled = [];
            const failures = [];
            const knownStaleRunIds = [
              37878328843, 37878595391, 37878551371,
              37878529656, 37878508294, 37878648462,
              37878704558
            ];
            const cancel = async (run_id, name) => {
              if (run_id === context.runId) return;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                canceled.push({id: run_id, name, status: 'cancel requested'});
              } catch (error) {
                failures.push({id: run_id, name, error: String(error.message || error).slice(0, 180)});
              }
            };
            for (const id of knownStaleRunIds) {
              await cancel(id, 'known stale runner workflow');
            }
            for (const status of ['queued', 'in_progress', 'pending']) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                status,
                per_page: 100
              });
              for (const run of response.data.workflow_runs || []) {
                if (targets.has(run.name)) await cancel(run.id, run.name);
              }
            }
            const body = [
              '### ABS VPS — limpeza de fila',
              '',
              'Cancelamentos solicitados: ' + canceled.length,
              ...canceled.map(x => '- #' + x.id + ' — ' + x.name),
              '',
              'Falhas: ' + failures.length,
              ...failures.map(x => '- #' + x.id + ' — ' + x.name + ': ' + x.error)
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || 121,
              body
            });
