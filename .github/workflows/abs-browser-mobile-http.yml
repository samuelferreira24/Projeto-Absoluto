name: ABS Browser Mobile HTTP Tailnet Access

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-browser-mobile-http-access
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 121 &&
      github.event.comment.user.login == 'samuelferreira24' &&
      github.event.comment.body == '/abs-browser mobile-http'
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 5
    steps:
      - name: Add and test private HTTP path through Tailscale
        id: configure
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/abs-browser-mobile-http.txt"
          install -m 600 /dev/null "$REPORT"
          exec > >(tee -a "$REPORT") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            { echo 'result<<ABS_MOBILE_HTTP_EOF'; tail -c 7000 "$REPORT"; echo; echo 'ABS_MOBILE_HTTP_EOF'; } >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          pass(){ printf 'PASS | %s\n' "$*"; }
          fail(){ printf 'FAIL | %s\n' "$*"; }
          [ "$(hostname)" = "abs-vps-01" ] || { fail "Unexpected host; refusing changes."; exit 1; }
          [ "$(sudo -n docker inspect abs-browser-ui --format '{{.State.Status}}')" = "running" ] || { fail "Original Chromium container is not running."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:8787/health >/dev/null || { fail "ABS health failed."; exit 1; }
          sudo -n systemctl is-active --quiet abs-browser-mobile-webapp.service || { fail "Mobile mirror service is not active."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:3010/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True' || { fail "Local mobile mirror health failed."; exit 1; }
          TAILNET_DNS="$(timeout 8s sudo -n tailscale status --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(((d.get("Self") or {}).get("DNSName") or "").rstrip("."))' 2>/dev/null || true)"
          TAILNET_IP="$(timeout 8s sudo -n tailscale ip -4 2>/dev/null | head -n 1 || true)"
          [ -n "$TAILNET_DNS" ] && [ -n "$TAILNET_IP" ] || { fail "Tailscale DNS name or private IPv4 address unavailable."; exit 1; }
          echo "Configuring HTTP access only on the private Tailscale network; no public port or firewall rule is opened."
          sudo -n tailscale serve --bg --yes --http=80 --set-path=/abs-mobile/ http://127.0.0.1:3010
          URL="http://$TAILNET_DNS/abs-mobile/"
          curl -fsS --max-time 10 --resolve "$TAILNET_DNS:80:$TAILNET_IP" "$URL/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True' || { fail "HTTP health through the Tailscale private address failed."; exit 1; }
          pass "Private HTTP path responds through the Tailscale IP."
          curl -fsS --max-time 10 --resolve "$TAILNET_DNS:80:$TAILNET_IP" "$URL/api/state" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("connected") is True and d.get("targetId")' || { fail "Private HTTP route cannot reach the active Chromium page."; exit 1; }
          pass "Private HTTP route reaches the live Chromium page."
          APP="$HOME/abs-browser/mobile-webapp" MIRROR_IP="$TAILNET_IP" TAILNET_DNS="$TAILNET_DNS" node <<'NODE'
          const WebSocket=require(process.env.APP+'/node_modules/ws');
          const ws=new WebSocket('ws://'+process.env.MIRROR_IP+'/abs-mobile/stream',{headers:{Host:process.env.TAILNET_DNS},perMessageDeflate:false,handshakeTimeout:7000});
          let done=false;
          const timer=setTimeout(()=>finish(new Error('No screen frame over the private HTTP/WebSocket route within 12 seconds.')),12000);
          function finish(err){if(done)return;done=true;clearTimeout(timer);try{ws.close();}catch{}if(err){console.error('FAIL | '+err.message);process.exitCode=1;}else console.log('PASS | Actual Chromium frame arrived over private HTTP/WebSocket.');}
          ws.on('message',raw=>{let m;try{m=JSON.parse(raw.toString());}catch{return;}if(m.type==='frame'&&typeof m.data==='string'&&m.data.length>100)finish();if(m.type==='error')finish(new Error(m.message||'Mirror stream error.'));});
          ws.on('error',e=>finish(e));
          NODE
          pass "The screen stream works over the private HTTP route."
          echo "PRIVATE_MOBILE_URL=$URL"
          echo "INFO | HTTP is reachable only through Tailscale; the WireGuard tunnel encrypts the connection. HTTPS route remains unchanged."
      - name: Publish private access result
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.configure.outputs.result }}
        with:
          script: |
            const body = [
              '### ABS MOBILE MIRROR — PRIVATE HTTP ACCESS',
              '',
              (process.env.RESULT || 'No report produced; inspect runner logs.').slice(0, 7000),
              '',
              'No browser credentials or tokens are included.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
