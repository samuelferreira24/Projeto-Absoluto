name: ABS Core
# Foundation suite only; legacy historical tests are not part of this vertical slice.
on:
  push:
    branches: ["main", "abs/capability-foundation-v1"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_vertical_slice.py
