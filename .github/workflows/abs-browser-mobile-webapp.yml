name: ABS Browser Mobile Web App Mirror

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-browser-mobile-webapp
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 121 &&
      github.event.comment.user.login == 'samuelferreira24' &&
      github.event.comment.body == '/abs-browser mobile-webapp'
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 12
    steps:
      - name: Checkout ABS mobile browser mirror
        uses: actions/checkout@v4

      - name: Install isolated web app and private CDP bridge
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/abs-browser-mobile-webapp.txt"
          APP_SERVICE_STARTED=0
          ROUTE_ADDED=0
          ROUTE_WAS_PRESENT=0
          install -m 600 /dev/null "$REPORT"
          exec > >(tee -a "$REPORT") 2>&1
          publish_result() {
            {
              echo 'result<<ABS_MOBILE_WEBAPP_EOF'
              sed -E 's/(PASSWORD|TOKEN|COOKIE|AUTHORIZATION)[=: ][^ ]*/\1=[REDACTED]/Ig' "$REPORT" | tail -c 9000
              echo
              echo 'ABS_MOBILE_WEBAPP_EOF'
            } >> "$GITHUB_OUTPUT"
          }
          finish() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              if [ "$ROUTE_ADDED" -eq 1 ] && [ "$ROUTE_WAS_PRESENT" -eq 0 ]; then
                sudo -n tailscale serve --set-path=/abs-mobile off >/dev/null 2>&1 || true
                echo "ROLLBACK | Removed the route created by this failed deployment."
              fi
              if [ "$APP_SERVICE_STARTED" -eq 1 ]; then
                sudo -n systemctl disable --now abs-browser-mobile-webapp.service >/dev/null 2>&1 || true
                echo "ROLLBACK | Failed mobile app stopped; existing browser and profile were not changed."
              fi
            fi
            publish_result
            exit "$rc"
          }
          trap finish EXIT
          pass(){ printf 'PASS | %s\n' "$*"; }
          blocked(){ printf 'BLOCKED | %s\n' "$*"; }
          fail(){ printf 'FAIL | %s\n' "$*"; }

          echo "ABS PHONE-FIRST BROWSER MIRROR"
          echo "UTC=$(date -u +%FT%TZ)"
          [ "$(hostname)" = "abs-vps-01" ] || { fail "Unexpected host; no changes made."; exit 1; }
          command -v node >/dev/null
          command -v npm >/dev/null
          sudo -n docker info >/dev/null
          [ "$(sudo -n docker inspect abs-browser-ui --format '{{.State.Status}}')" = "running" ] || { fail "Persistent Chromium is not running; no changes made."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:8787/health >/dev/null || { fail "ABS API health failed; no changes made."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:9222/json/version >/dev/null || { fail "Loopback Chromium DevTools is unavailable; no changes made."; exit 1; }
          PROFILE_MOUNT="$(sudo -n docker inspect abs-browser-ui --format '{{range .Mounts}}{{if eq .Destination "/config"}}{{.Source}}{{end}}{{end}}')"
          [ -d "$PROFILE_MOUNT/chromium-abs-profile" ] || { fail "Persistent Chromium profile not found; no changes made."; exit 1; }
          [ -s "$HOME/.config/abs-browser/browser.env" ] || { fail "Protected browser credentials file missing; no changes made."; exit 1; }
          pass "Preflight passed: ABS, Chromium DevTools, persistent profile and protected credentials exist."
          echo "No browser container restart, profile rewrite, firewall opening or public port binding will be performed."

          SOURCE="$GITHUB_WORKSPACE/abs_browser/mobile_webapp"
          APP="$HOME/abs-browser/mobile-webapp"
          [ -s "$SOURCE/server.js" ] && [ -s "$SOURCE/public/index.html" ] && [ -s "$SOURCE/package.json" ] || { fail "Mobile web app source files are incomplete."; exit 1; }
          node --check "$SOURCE/server.js"
          node --check "$SOURCE/smoke-test.js"
          python3 - "$SOURCE/public/index.html" "$RUNNER_TEMP/abs-mobile-ui.js" <<'PY'
          import re,sys
          from pathlib import Path
          html=Path(sys.argv[1]).read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if len(scripts)!=1 or 'ABS Browser' not in html or 'typing-active' not in html:
              raise SystemExit('FAIL | UI source structure/keyboard proxy check failed.')
          Path(sys.argv[2]).write_text(scripts[0])
          PY
          node --check "$RUNNER_TEMP/abs-mobile-ui.js"
          pass "Server, isolated end-to-end audit and embedded mobile UI JavaScript pass syntax checks."
          install -d -m 700 "$APP" "$APP/public"
          install -m 600 "$SOURCE/server.js" "$APP/server.js"
          install -m 600 "$SOURCE/package.json" "$APP/package.json"
          install -m 644 "$SOURCE/public/index.html" "$APP/public/index.html"
          cd "$APP"
          npm install --omit=dev --no-audit --no-fund --package-lock=false
          NODE_BIN="$(command -v node)"
          sudo -n tee /etc/systemd/system/abs-browser-mobile-webapp.service >/dev/null <<UNIT
          [Unit]
          Description=ABS private mobile browser mirror and CDP touch bridge
          After=network-online.target abs.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=absadmin
          Group=absadmin
          WorkingDirectory=$APP
          Environment=NODE_ENV=production
          Environment=HOST=127.0.0.1
          Environment=PORT=3010
          Environment=ABS_BROWSER_CDP_URL=http://127.0.0.1:9222
          ExecStart=$NODE_BIN $APP/server.js
          Restart=always
          RestartSec=2
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=read-only
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          LockPersonality=true

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable abs-browser-mobile-webapp.service
          sudo -n systemctl restart abs-browser-mobile-webapp.service
          READY=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:3010/health >/dev/null; then READY=1; break; fi
            sleep 2
          done
          [ "$READY" -eq 1 ] || { sudo -n journalctl -u abs-browser-mobile-webapp.service -n 35 --no-pager; fail "Mobile mirror service failed health check."; exit 1; }
          curl -fsS --max-time 8 http://127.0.0.1:3010/api/state | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("connected") is True; assert d.get("viewport",{}).get("width",0)>0; print("PASS | CDP state query and page viewport verified.")'
          pass "Web app is serving on loopback only at 127.0.0.1:3010; Chromium was not restarted."
          ABS_BROWSER_APP_DIR="$APP" node "$GITHUB_WORKSPACE/abs_browser/mobile_webapp/smoke-test.js"
          pass "End-to-end audit passed: live stream, isolated touch-to-focus, one-finger scroll and two-finger pinch."


          if command -v tailscale >/dev/null 2>&1 && timeout 8s sudo -n tailscale status --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("BackendState")=="Running" else 1)'; then
            if timeout 8s sudo -n tailscale serve status 2>&1 | grep -q '/abs-mobile'; then ROUTE_WAS_PRESENT=1; fi
            sudo -n tailscale serve --bg --yes --set-path=/abs-mobile/ http://127.0.0.1:3010 >/dev/null
            if [ "$ROUTE_WAS_PRESENT" -eq 0 ]; then ROUTE_ADDED=1; fi
            timeout 8s sudo -n tailscale serve status 2>&1 | grep -q '3010' || { fail "Private Tailscale route did not confirm port 3010."; exit 1; }
            pass "Private Tailscale Serve route /abs-mobile configured; no public port opened."
            TAILNET_DNS="$(timeout 8s sudo -n tailscale status --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(((d.get("Self") or {}).get("DNSName") or "").rstrip("."))' 2>/dev/null || true)"
            if [ -n "$TAILNET_DNS" ]; then echo "PRIVATE_MOBILE_URL=https://${TAILNET_DNS}/abs-mobile/"; else echo "INFO | Tailscale DNS name unavailable; route remains private."; fi
          else
            blocked "Tailscale is not authenticated/running. App is installed locally but remote phone access remains blocked until private Tailscale access is active."
          fi
          pass "Profile, credentials, browser container, firewall and existing root browser route were left intact."
          echo "ABS MOBILE WEB APP DEPLOY FINISHED"

      - name: Publish sanitized report
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
        with:
          script: |
            const body = [
              '### ABS BROWSER MOBILE WEB APP — DEPLOY REPORT',
              '',
              (process.env.RESULT || 'No final report produced; inspect private runner logs.').slice(0, 9000),
              '',
              'No browser credentials or tokens are included. The private access URL is included for the owner.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
