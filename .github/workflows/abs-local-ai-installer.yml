name: ABS Local AI Installer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  install:
    if: github.event.issue.pull_request == null && github.event.comment.user.login == 'samuelferreira24' && github.event.comment.body == '/abs local-ai-install'
    runs-on: [self-hosted, abs-vps-01]
    timeout-minutes: 45
    steps:
      - name: Install local AI fleet
        shell: bash
        run: |
          set -e
          export HOME=/home/absadmin
          export PATH="/home/absadmin/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          sudo systemctl enable ollama
          sudo systemctl restart ollama
          sleep 3
          for model in qwen3.5:0.8b qwen3.5:2b qwen3.5:4b ministral-3:3b gemma4:e2b gemma4:e4b; do
            echo "PULL $model"
            ollama pull "$model"
          done
          sudo tee /etc/abs-local-models.env >/dev/null <<'ENV'
ABS_LOCAL_AI_MODELS=qwen3.5-0.8b|http://127.0.0.1:11434|qwen3.5:0.8b,qwen3.5-2b|http://127.0.0.1:11434|qwen3.5:2b,qwen3.5-4b|http://127.0.0.1:11434|qwen3.5:4b,ministral-3b|http://127.0.0.1:11434|ministral-3:3b,gemma4-e2b|http://127.0.0.1:11434|gemma4:e2b,gemma4-e4b|http://127.0.0.1:11434|gemma4:e4b
ABS_LOCAL_AI_URL=http://127.0.0.1:11434
ABS_LOCAL_AI_MODEL=qwen3.5:4b
ENV
          if [ -f /etc/systemd/system/abs.service ]; then
            sudo sed -i '/EnvironmentFile=-\/etc\/abs-local-models.env/d' /etc/systemd/system/abs.service
            sudo sed -i '/^Environment=PYTHONUNBUFFERED=1$/a EnvironmentFile=-/etc/abs-local-models.env' /etc/systemd/system/abs.service
            sudo systemctl daemon-reload
            sudo systemctl restart abs.service
            sleep 3
          fi
          echo "=== OLLAMA ==="
          ollama --version
          echo "=== MODELS ==="
          ollama list
          echo "=== ABS ==="
          curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status
