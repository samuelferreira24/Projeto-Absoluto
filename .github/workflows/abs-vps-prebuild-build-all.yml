name: ABS Browser Build and Validation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-browser-build-all
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 121 &&
      github.event.comment.user.login == 'samuelferreira24' &&
      github.event.comment.body == '/abs-prebuild build-all'
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 30
    steps:
      - name: Build browser safely and validate host
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          # This job uses only host-level Docker/service checks; it must not enter,
          # reset, clean, or otherwise mutate the runner's shared repository workspace.
          # Existing local changes are deliberately left untouched.

          REPORT="$RUNNER_TEMP/abs-browser-build-report.txt"
          install -m 600 /dev/null "$REPORT"
          exec > >(tee -a "$REPORT") 2>&1
          publish_result() {
            {
              echo 'result<<ABS_BUILD_EOF'
              sed -E 's/(CUSTOM_PASSWORD=)[^ ]+/\\1[REDACTED]/g; s/(PASSWORD|TOKEN|COOKIE|AUTHORIZATION)[=: ][^ ]*/\\1=[REDACTED]/Ig' "$REPORT" | tail -c 12000
              echo
              echo 'ABS_BUILD_EOF'
            } >> "$GITHUB_OUTPUT"
          }
          trap publish_result EXIT

          pass(){ printf 'PASS | %s\n' "$*"; }
          fail(){ printf 'FAIL | %s\n' "$*"; }
          blocked(){ printf 'BLOCKED | %s\n' "$*"; }
          note(){ printf 'INFO | %s\n' "$*"; }

          echo "ABS BROWSER BUILD — SAFE, IDEMPOTENT RUN"
          echo "UTC=$(date -u +%FT%TZ)"
          echo "Host=$(hostname)"
          echo "This run never removes existing services, volumes, models, or user data."
          echo

          if ! sudo -n docker info >/dev/null 2>&1; then
            fail "Docker unavailable to authorized runner; no deployment attempted."
            exit 1
          fi
          pass "Docker API accessible through authorized sudo"
          sudo docker ps --format 'CONTAINER {{.Names}} | {{.Image}} | {{.Status}} | {{.Ports}}' || true

          echo
          echo "=== Baseline ==="
          free -b
          df -B1 /
          curl -fsS --max-time 5 http://127.0.0.1:8787/health >/dev/null && pass "ABS health endpoint responds" || { fail "ABS health endpoint failed"; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null && pass "Ollama tags endpoint responds" || note "Ollama tags endpoint not responding; browser can still be isolated from it."
          sudo docker inspect coolify --format 'Coolify container={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' 2>/dev/null || note "Coolify container name not found; no changes made to Coolify."
          echo

          AVAILABLE_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          DISK_FREE_KB=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$AVAILABLE_KB" -lt 1572864 ]; then
            blocked "Available RAM below 1.5 GiB; deployment deferred to protect ABS and local models."
            exit 0
          fi
          if [ "$DISK_FREE_KB" -lt 8388608 ]; then
            blocked "Root filesystem has less than 8 GiB free; deployment deferred."
            exit 0
          fi
          pass "Resource preflight: RAM and disk exceed conservative minimums"

          echo
          echo "=== Exposure audit (read-only) ==="
          sudo docker ps --format '{{.Names}} {{.Ports}}' | grep -E '0\.0\.0\.0:8080|\[::\]:8080|0\.0\.0\.0:9222|\[::\]:9222' && note "Public Docker-published port(s) require separate review; existing proxy will not be changed automatically." || pass "No matching public 8080/CDP mapping in current container list"
          sudo ufw status verbose 2>/dev/null || true
          deploy_browser() {
            install -d -m 750 "$HOME/.config/abs-browser"
            install -d -m 750 "$HOME/abs-browser/config" "$HOME/abs-browser/backups"
            chmod 700 "$HOME/.config/abs-browser" "$HOME/abs-browser/config" "$HOME/abs-browser/backups"

            ENVFILE="$HOME/.config/abs-browser/browser.env"
            if [ ! -s "$ENVFILE" ]; then
              USERNAME="absimperador"
              PASSWORD="$(openssl rand -hex 24)"
              umask 077
              printf 'CUSTOM_USER=%s\nPASSWORD=%s\nTITLE=ABS Browser\n' "$USERNAME" "$PASSWORD" > "$ENVFILE"
              chmod 600 "$ENVFILE"
              unset PASSWORD
              pass "Generated browser credential stored in a mode-600 host file; never printed to logs."
            else
              # linuxserver/chromium uses PASSWORD, not CUSTOM_PASSWORD. Migrate the
              # existing secret in-place without printing it or changing its value.
              if ! grep -q '^PASSWORD=' "$ENVFILE"; then
                OLD_PASSWORD="$(sed -n 's/^CUSTOM_PASSWORD=//p' "$ENVFILE" | head -n 1)"
                if [ -n "$OLD_PASSWORD" ]; then
                  printf '\nPASSWORD=%s\n' "$OLD_PASSWORD" >> "$ENVFILE"
                  chmod 600 "$ENVFILE"
                  unset OLD_PASSWORD
                  pass "Migrated existing protected credential key to the image-supported PASSWORD variable."
                fi
              fi
              pass "Reusing existing protected browser credential file."
            fi

            if ! sudo docker image inspect lscr.io/linuxserver/chromium:latest >/dev/null 2>&1; then
              sudo docker pull lscr.io/linuxserver/chromium:latest
            fi

            # No --init: linuxserver's s6 overlay must itself be PID 1.
            # Bind only to IPv4 loopback. No public host port, no CDP port.
            sudo docker run -d \
              --name abs-browser-ui \
              --restart unless-stopped \
              --security-opt no-new-privileges:true \
              --cap-drop NET_RAW \
              --memory 1280m --memory-swap 1792m --cpus 1.50 --pids-limit 512 \
              --shm-size 512m \
              --env-file "$ENVFILE" \
              -e PUID="$(id -u)" -e PGID="$(id -g)" -e TZ=Etc/UTC \
              -p 127.0.0.1:3000:3000 \
              -v "$HOME/abs-browser/config:/config" \
              lscr.io/linuxserver/chromium:latest
            pass "Browser container created with persistent /config and loopback-only port binding."
          }

          if sudo docker inspect abs-browser-ui >/dev/null 2>&1; then
            EXISTING_STATE="$(sudo docker inspect abs-browser-ui --format '{{.State.Status}}')"
            EXISTING_LOGS="$(sudo docker logs --tail 30 abs-browser-ui 2>&1 || true)"
            EXISTING_BINDINGS="$(sudo docker inspect abs-browser-ui --format '{{json .HostConfig.PortBindings}}')"
            if printf '%s' "$EXISTING_LOGS" | grep -q 's6-overlay-suexec: fatal: can only run as pid 1' || ! printf '%s' "$EXISTING_BINDINGS" | grep -q '9222'; then
              note "Replacing only the ABS browser container to apply the verified startup fix/loopback CDP binding; persistent host profile/config and credentials are preserved."
              sudo docker rm -f abs-browser-ui >/dev/null
              deploy_browser
            elif [ "$EXISTING_STATE" != "running" ]; then
              sudo docker start abs-browser-ui >/dev/null
              pass "Started existing browser container without removing it."
            else
              pass "Existing browser container is already running; reusing it."
            fi
          else
            echo
            echo "=== Browser deployment ==="
            deploy_browser
          fi

          echo
          echo "=== Runtime checks ==="
          for i in $(seq 1 24); do
            STATE="$(sudo docker inspect abs-browser-ui --format '{{.State.Status}}' 2>/dev/null || true)"
            if [ "$STATE" = running ]; then break; fi
            sleep 5
          done
          STATE="$(sudo docker inspect abs-browser-ui --format '{{.State.Status}}' 2>/dev/null || true)"
          if [ "$STATE" != running ]; then
            fail "Browser container is not running. Preserve its files and inspect container logs privately."
            sudo docker ps -a --filter name=abs-browser-ui --format 'Browser state={{.Status}}' || true
            note "Container logs intentionally withheld from the public issue report to prevent accidental disclosure."
            exit 1
          fi
          pass "Browser container state is running"

          BINDING="$(sudo docker inspect abs-browser-ui --format '{{json .HostConfig.PortBindings}}')"
          echo "Port binding metadata: $BINDING"
          if printf '%s' "$BINDING" | grep -q '127.0.0.1'; then
            pass "Browser UI host binding is loopback-only"
          else
            fail "Browser UI port binding is not confirmed loopback-only"
            exit 1
          fi

          HTTP_CODE=""
          for i in $(seq 1 12); do
            HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3000/ 2>/dev/null || true)"
            case "$HTTP_CODE" in 200|301|302|401|403) break ;; esac
            sleep 5
          done
          case "$HTTP_CODE" in
            200|301|302|401|403) pass "Browser UI HTTP endpoint responds locally (HTTP $HTTP_CODE)" ;;
            *) fail "Browser UI HTTP endpoint did not become ready after 60 seconds (HTTP ${HTTP_CODE:-no-response})."; sudo docker logs --tail 30 abs-browser-ui 2>&1 | grep -Ei 'error|fatal|failed|listen|port' | tail -n 15 || true; exit 1 ;;
          esac

          MOUNT_SOURCE="$(sudo docker inspect abs-browser-ui --format '{{range .Mounts}}{{if eq .Destination "/config"}}{{.Source}}{{end}}{{end}}')"
          if [ "$MOUNT_SOURCE" = "$HOME/abs-browser/config" ]; then
            pass "Persistent profile/config bind mount verified at $MOUNT_SOURCE"
          else
            fail "Persistent /config bind mount did not match the expected host path"
            exit 1
          fi

          echo
          echo "=== ABS browser-control endpoint ==="
          CDP_READY=0
          for i in $(seq 1 6); do
            if curl -fsS --max-time 5 http://127.0.0.1:9222/json/version >/dev/null 2>&1; then CDP_READY=1; break; fi
            sleep 5
          done
          if [ "$CDP_READY" -eq 1 ]; then
            pass "Chromium DevTools endpoint responds on host loopback only"
            curl -fsS --max-time 5 http://127.0.0.1:9222/json/version | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Browser="+str(d.get("Browser","unknown")))' || true
          else
            blocked "Chromium remote-debugging endpoint is not responding; visual browser remains isolated and ABS navigation adapter will not be enabled."
          fi

          echo
          echo "=== Profile backup and restore integrity ==="
          BACKUP="$HOME/abs-browser/backups/profile-$(date -u +%F).tar.gz"
          TEMP_BACKUP="$BACKUP.partial"
          tar -czf "$TEMP_BACKUP" -C "$HOME/abs-browser" config
          chmod 600 "$TEMP_BACKUP"
          mv -f "$TEMP_BACKUP" "$BACKUP"
          BACKUP_SHA="$(sha256sum "$BACKUP" | awk '{print $1}')"
          RESTORE_DIR="$(mktemp -d "$HOME/abs-browser/backups/restore-test.XXXXXX")"
          if tar -xzf "$BACKUP" -C "$RESTORE_DIR" && [ -d "$RESTORE_DIR/config" ]; then
            (cd "$HOME/abs-browser/config" && find . -type f -print0 | sort -z | xargs -0 -r sha256sum) > "$RESTORE_DIR/original.manifest"
            (cd "$RESTORE_DIR/config" && find . -type f -print0 | sort -z | xargs -0 -r sha256sum) > "$RESTORE_DIR/restored.manifest"
            if diff -u "$RESTORE_DIR/original.manifest" "$RESTORE_DIR/restored.manifest" >/dev/null; then
              pass "Profile backup extracted and file-by-file SHA256 restore comparison passed"
            else
              fail "Restored profile differs from original profile manifest"
              rm -rf "$RESTORE_DIR"
              exit 1
            fi
          else
            fail "Profile backup/restore staging test failed"
            rm -rf "$RESTORE_DIR"
            exit 1
          fi
          rm -rf "$RESTORE_DIR"
          echo "Backup archive=$BACKUP size_bytes=$(stat -c %s "$BACKUP") sha256=$BACKUP_SHA"
          pass "Backup file stored with restrictive permissions and same-day rotation"

          echo
          echo "=== Browser restart/persistence regression ==="
          sudo docker restart abs-browser-ui >/dev/null
          READY=0
          for i in $(seq 1 12); do
            STATE="$(sudo docker inspect abs-browser-ui --format '{{.State.Status}}' 2>/dev/null || true)"
            HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:3000/ 2>/dev/null || true)"
            if [ "$STATE" = running ] && printf '%s' "$HTTP_CODE" | grep -Eq '^(200|301|302|401|403)
          echo
          echo "=== Private mobile access readiness ==="
          if command -v tailscale >/dev/null 2>&1 && sudo tailscale status --json >/dev/null 2>&1; then
            if sudo tailscale status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("BackendState")=="Running" else 1)'; then
              if sudo tailscale serve --bg http://127.0.0.1:3000 >/dev/null 2>&1; then
                pass "Tailscale Serve configured for private HTTPS access; no public browser port opened."
                sudo tailscale status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Tailnet state="+str(d.get("BackendState","unknown")))' || true
              else
                blocked "Tailscale is connected but private Serve could not be configured; no public port opened."
              fi
            else
              blocked "Tailscale is installed but not authenticated/connected. Browser remains loopback-only."
              sudo tailscale status 2>&1 | head -n 8 || true
            fi
          else
            blocked "Private overlay (Tailscale) is not available/connected. Browser remains loopback-only; do not expose it publicly."
          fi

          echo
          echo "=== ABS regression ==="
          curl -fsS --max-time 8 http://127.0.0.1:8787/health >/dev/null && pass "ABS remains healthy after browser deployment" || fail "ABS health regression detected"
          curl -fsS --max-time 8 http://127.0.0.1:11434/api/tags >/dev/null && pass "Ollama remains responsive" || note "Ollama did not respond during final smoke test"
          echo
          echo "=== Limits of this run ==="
          note "This workflow deploys the interactive browser only; it does not claim ABS automation integration, profile backup/restore, reboot validation, or external mobile access unless separately proven."
          note "No existing container, model, firewall rule, proxy route, or Coolify service was removed or modified."
          note "Credential file is at $HOME/.config/abs-browser/browser.env with mode 600; retrieve it only in an authenticated SSH session and never paste it into an issue."
          echo

      - name: Publish sanitized result
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.build.outputs.result }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '### ABS BROWSER BUILD — RESULT',
              '',
              'Trigger accepted only from the repository owner on issue #121.',
              '',
              (process.env.RESULT || '(The build step did not produce a final report. Inspect the Actions job logs; do not post credentials or raw environment output.)').slice(0, 12000),
              '',
              'This report does not contain browser credentials. No credential values should be posted in issue comments.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
; then READY=1; break; fi
            sleep 5
          done
          if [ "$READY" -eq 1 ]; then
            pass "Browser recovered after container restart; HTTP $HTTP_CODE"
          else
            fail "Browser did not recover after container restart"
            exit 1
          fi
          sudo docker inspect abs-browser-ui --format 'state={{.State.Status}} restarts={{.RestartCount}} memory_limit={{.HostConfig.Memory}} cpu_nanos={{.HostConfig.NanoCpus}} pids_limit={{.HostConfig.PidsLimit}}' || true

          echo
          echo "=== Private mobile access readiness ==="
          if command -v tailscale >/dev/null 2>&1 && sudo tailscale status --json >/dev/null 2>&1; then
            if sudo tailscale status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("BackendState")=="Running" else 1)'; then
              if sudo tailscale serve --bg http://127.0.0.1:3000 >/dev/null 2>&1; then
                pass "Tailscale Serve configured for private HTTPS access; no public browser port opened."
                sudo tailscale status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Tailnet state="+str(d.get("BackendState","unknown")))' || true
              else
                blocked "Tailscale is connected but private Serve could not be configured; no public port opened."
              fi
            else
              blocked "Tailscale is installed but not authenticated/connected. Browser remains loopback-only."
              sudo tailscale status 2>&1 | head -n 8 || true
            fi
          else
            blocked "Private overlay (Tailscale) is not available/connected. Browser remains loopback-only; do not expose it publicly."
          fi

          echo
          echo "=== ABS regression ==="
          curl -fsS --max-time 8 http://127.0.0.1:8787/health >/dev/null && pass "ABS remains healthy after browser deployment" || fail "ABS health regression detected"
          curl -fsS --max-time 8 http://127.0.0.1:11434/api/tags >/dev/null && pass "Ollama remains responsive" || note "Ollama did not respond during final smoke test"
          echo
          echo "=== Limits of this run ==="
          note "This workflow deploys the interactive browser only; it does not claim ABS automation integration, profile backup/restore, reboot validation, or external mobile access unless separately proven."
          note "No existing container, model, firewall rule, proxy route, or Coolify service was removed or modified."
          note "Credential file is at $HOME/.config/abs-browser/browser.env with mode 600; retrieve it only in an authenticated SSH session and never paste it into an issue."
          echo

      - name: Publish sanitized result
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.build.outputs.result }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '### ABS BROWSER BUILD — RESULT',
              '',
              'Trigger accepted only from the repository owner on issue #121.',
              '',
              (process.env.RESULT || '(The build step did not produce a final report. Inspect the Actions job logs; do not post credentials or raw environment output.)').slice(0, 12000),
              '',
              'This report does not contain browser credentials. No credential values should be posted in issue comments.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
