name: ABS Browser Mobile Native Interaction

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-browser-mobile-native
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 121 &&
      github.event.comment.user.login == 'samuelferreira24' &&
      github.event.comment.body == '/abs-browser mobile-native'
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 35
    steps:
      - name: Switch to direct-touch presentation and remove injected zoom overlay
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/abs-browser-mobile-native.txt"
          install -m 600 /dev/null "$REPORT"
          exec > >(tee -a "$REPORT") 2>&1
          pass(){ printf 'PASS | %s\n' "$*"; }
          fail(){ printf 'FAIL | %s\n' "$*"; }
          ROLLBACK_NAME="abs-browser-ui-mobile-native-rollback"
          OLD_RENAMED=0
          finish() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$OLD_RENAMED" -eq 1 ]; then
              sudo -n docker rm -f abs-browser-ui >/dev/null 2>&1 || true
              sudo -n docker rename "$ROLLBACK_NAME" abs-browser-ui >/dev/null 2>&1 || true
              sudo -n docker start abs-browser-ui >/dev/null 2>&1 || true
              echo "ROLLBACK | Previous browser container restored."
            fi
            { echo 'result<<ABS_NATIVE_EOF'; tail -c 9000 "$REPORT"; echo; echo 'ABS_NATIVE_EOF'; } >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT

          [ "$(hostname)" = "abs-vps-01" ] || { fail "Unexpected host; refusing changes."; exit 1; }
          sudo -n docker info >/dev/null
          [ "$(sudo -n docker inspect abs-browser-ui --format '{{.State.Status}}')" = "running" ] || { fail "Browser container is not running; no changes made."; exit 1; }
          curl -fsS --max-time 8 http://127.0.0.1:8787/health >/dev/null || { fail "ABS health failed; no changes made."; exit 1; }

          PROFILE_MOUNT="$(sudo -n docker inspect abs-browser-ui --format '{{range .Mounts}}{{if eq .Destination "/config"}}{{.Source}}{{end}}{{end}}')"
          IMAGE="$(sudo -n docker inspect abs-browser-ui --format '{{.Config.Image}}')"
          ENVFILE="$HOME/.config/abs-browser/browser.env"
          [ -d "$PROFILE_MOUNT/chromium-abs-profile" ] || { fail "Persistent browser profile missing."; exit 1; }
          [ -s "$ENVFILE" ] || { fail "Protected browser credential file missing."; exit 1; }
          [ ! -e "$ROLLBACK_NAME" ] || { fail "Rollback container already exists; refusing overwrite."; exit 1; }

          echo "Preserving image, credentials, profile, network protections and resource limits."
          echo "Image=$IMAGE"
          echo "Profile=$PROFILE_MOUNT"
          echo "=== Build touch-native Selkies client (pinned upstream 2.0.0) ==="
          AVAILABLE_KB="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          DISK_FREE_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [ "$AVAILABLE_KB" -lt 2621440 ] || [ "$DISK_FREE_KB" -lt 8388608 ]; then
            fail "Resource guard: need at least 2.5 GiB available RAM and 8 GiB disk free to build safely; current browser left untouched."
            exit 1
          fi
          command -v git >/dev/null
          command -v node >/dev/null
          command -v npm >/dev/null
          SOURCE_DIR="$HOME/abs-browser/selkies-source"
          CORE_DIR="$SOURCE_DIR/addons/selkies-web-core"
          DASH_DIR="$SOURCE_DIR/addons/selkies-dashboard"
          if [ -d "$SOURCE_DIR/.git" ]; then
            git -C "$SOURCE_DIR" fetch --depth 1 origin tag 2.0.0
            git -C "$SOURCE_DIR" checkout -f 2.0.0
            git -C "$SOURCE_DIR" reset --hard 2.0.0
            git -C "$SOURCE_DIR" clean -fdx
          else
            git clone --depth 1 --branch 2.0.0 https://github.com/selkies-project/selkies.git "$SOURCE_DIR"
          fi
          pass "Fetched pinned Selkies 2.0.0 source into the dedicated ABS browser workspace."
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path.home() / "abs-browser/selkies-source/addons/selkies-web-core/lib/input.js"
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"FAIL | Selkies patch anchor {label!r} expected once, found {count}; browser was not stopped.")
              s = s.replace(old, new, 1)

          def replace_regex_once(pattern, replacement, label):
              global s
              s2, count = re.subn(pattern, replacement, s, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"FAIL | Selkies regex patch anchor {label!r} expected once, found {count}; browser was not stopped.")
              s = s2

          replace_once(
              """this._trackpadLastScrollCentroid = null;
                  this._touchScrollLastCentroid = null;
                  this.inputAttached = false;""",
              """this._trackpadLastScrollCentroid = null;
                  this._touchScrollLastCentroid = null;
                  this._touchScrollLastDistance = null;
                  this._touchGestureMode = null;
                  this._touchPinchAccum = 0;
                  this._singleTouchScrollAccumY = 0;
                  this._singleTouchScrollAccumX = 0;
                  this._isSingleFingerScroll = false;
                  this.inputAttached = false;""",
              "constructor-state")
          replace_regex_once(
              r"(currentX: touch\.clientX, currentY: touch\.clientY,\n)([ \t]*)startTime: now, identifier: touch\.identifier,",
              lambda m: m.group(1) + m.group(2) + "lastScrollX: touch.clientX, lastScrollY: touch.clientY,\n" + m.group(2) + "startTime: now, identifier: touch.identifier,",
              "touch-origin")
          replace_regex_once(
              r"(?m)^([ \t]*)this\._touchScrollLastCentroid = \{\n([ \t]*)x: \(touches\[0\]\.currentX \+ touches\[1\]\.currentX\) / 2,\n\2y: \(touches\[0\]\.currentY \+ touches\[1\]\.currentY\) / 2\n\1\};",
              lambda m: m.group(0) + "\n" + m.group(1) + "this._touchScrollLastDistance = Math.hypot(\n" + m.group(1) + "    touches[0].currentX - touches[1].currentX,\n" + m.group(1) + "    touches[0].currentY - touches[1].currentY\n" + m.group(1) + ");\n" + m.group(1) + "this._touchGestureMode = null;\n" + m.group(1) + "this._touchPinchAccum = 0;",
              "two-finger-origin")
          replace_once(
              """if (this._touchScrollLastCentroid) {
                          const deltaX = curr_avg_x - this._touchScrollLastCentroid.x;
                          const deltaY = curr_avg_y - this._touchScrollLastCentroid.y;
                          const SCROLL_THRESHOLD = 2;
                          if (Math.abs(deltaY) > SCROLL_THRESHOLD) this._triggerMouseWheel(deltaY < 0 ? 'down' : 'up', 1);
                          if (Math.abs(deltaX) > SCROLL_THRESHOLD) this._triggerHorizontalMouseWheel(deltaX < 0 ? 'left' : 'right', 1);
                      }
                      this._touchScrollLastCentroid = { x: curr_avg_x, y: curr_avg_y };""",
              """if (this._touchScrollLastCentroid) {
                          const deltaX = curr_avg_x - this._touchScrollLastCentroid.x;
                          const deltaY = curr_avg_y - this._touchScrollLastCentroid.y;
                          const currDistance = Math.hypot(
                              touches[0].currentX - touches[1].currentX,
                              touches[0].currentY - touches[1].currentY
                          );
                          const deltaDistance = this._touchScrollLastDistance === null ? 0 : currDistance - this._touchScrollLastDistance;
                          if (this._touchGestureMode === null) {
                              if (Math.abs(deltaDistance) >= 6) this._touchGestureMode = 'pinch';
                              else if (Math.abs(deltaX) >= 4 || Math.abs(deltaY) >= 4) this._touchGestureMode = 'scroll';
                          }
                          if (this._touchGestureMode === 'pinch') {
                              this._touchPinchAccum += deltaDistance;
                              while (Math.abs(this._touchPinchAccum) >= 20) {
                                  const zoomDirection = this._touchPinchAccum > 0 ? 'up' : 'down';
                                  this._sendKeyEvent(KeyTable.XK_Control_L, 'ControlLeft', true);
                                  this._triggerMouseWheel(zoomDirection, 1);
                                  this._sendKeyEvent(KeyTable.XK_Control_L, 'ControlLeft', false);
                                  this._touchPinchAccum += this._touchPinchAccum > 0 ? -20 : 20;
                              }
                          } else if (this._touchGestureMode === 'scroll') {
                              const SCROLL_THRESHOLD = 2;
                              if (Math.abs(deltaY) > SCROLL_THRESHOLD) this._triggerMouseWheel(deltaY < 0 ? 'down' : 'up', 1);
                              if (Math.abs(deltaX) > SCROLL_THRESHOLD) this._triggerHorizontalMouseWheel(deltaX < 0 ? 'left' : 'right', 1);
                          }
                          this._touchScrollLastDistance = currDistance;
                      }
                      this._touchScrollLastCentroid = { x: curr_avg_x, y: curr_avg_y };""",
              "two-finger-pinch")
          replace_once(
              """if (this._activeTouchIdentifier === singleTouchID) {
                          this._calculateTouchCoordinates({ clientX: touchData.currentX, clientY: touchData.currentY }); this._sendMouseState();
                          activeTouchMoved = true; preventDefault = true;
                      } else if (this._activeTouchIdentifier === null && !touchData.longPressCompleted) {
                          const dx = touchData.currentX - touchData.startX;
                          const dy = touchData.currentY - touchData.startY;
                          const distSq = dx * dx + dy * dy;
                          if (distSq >= TAP_THRESHOLD_DISTANCE_SQ_LOGICAL) {
                              if (this._longPressTimer && singleTouchID === this._longPressTouchIdentifier) { clearTimeout(this._longPressTimer); this._longPressTimer = null; }
                              this._activeTouchIdentifier = singleTouchID;
                              this._calculateTouchCoordinates({ clientX: touchData.currentX, clientY: touchData.currentY });
                              this.buttonMask |= 1; this._sendMouseState();
                              activeTouchMoved = true; preventDefault = true;
                          } else { preventDefault = true; }
                      }""",
              """if (this._activeTouchIdentifier === singleTouchID) {
                          this._calculateTouchCoordinates({ clientX: touchData.currentX, clientY: touchData.currentY }); this._sendMouseState();
                          activeTouchMoved = true; preventDefault = true;
                      } else if (this._activeTouchIdentifier === null && !touchData.longPressCompleted) {
                          const dx = touchData.currentX - touchData.startX;
                          const dy = touchData.currentY - touchData.startY;
                          const distSq = dx * dx + dy * dy;
                          if (distSq >= TAP_THRESHOLD_DISTANCE_SQ_LOGICAL) {
                              if (this._longPressTimer && singleTouchID === this._longPressTouchIdentifier) { clearTimeout(this._longPressTimer); this._longPressTimer = null; }
                              this._isSingleFingerScroll = true;
                              const scrollDX = touchData.currentX - touchData.lastScrollX;
                              const scrollDY = touchData.currentY - touchData.lastScrollY;
                              touchData.lastScrollX = touchData.currentX;
                              touchData.lastScrollY = touchData.currentY;
                              this._singleTouchScrollAccumY += scrollDY;
                              this._singleTouchScrollAccumX += scrollDX;
                              const PIXELS_PER_SCROLL_NOTCH = 28;
                              while (Math.abs(this._singleTouchScrollAccumY) >= PIXELS_PER_SCROLL_NOTCH) {
                                  const direction = this._singleTouchScrollAccumY < 0 ? 'down' : 'up';
                                  this._triggerMouseWheel(direction, 1);
                                  this._singleTouchScrollAccumY += this._singleTouchScrollAccumY < 0 ? PIXELS_PER_SCROLL_NOTCH : -PIXELS_PER_SCROLL_NOTCH;
                              }
                              while (Math.abs(this._singleTouchScrollAccumX) >= PIXELS_PER_SCROLL_NOTCH) {
                                  const direction = this._singleTouchScrollAccumX < 0 ? 'left' : 'right';
                                  this._triggerHorizontalMouseWheel(direction, 1);
                                  this._singleTouchScrollAccumX += this._singleTouchScrollAccumX < 0 ? PIXELS_PER_SCROLL_NOTCH : -PIXELS_PER_SCROLL_NOTCH;
                              }
                              activeTouchMoved = true; preventDefault = true;
                          } else { preventDefault = true; }
                      }""",
              "single-finger-scroll")
          replace_regex_once(
              r"(?m)^([ \t]*)this\._isTwoFingerGesture = false;\n\1this\._touchScrollLastCentroid = null;\n(?=[ \t]*\})",
              lambda m: m.group(0) + m.group(1) + "this._touchScrollLastDistance = null;\n" + m.group(1) + "this._touchGestureMode = null;\n" + m.group(1) + "this._touchPinchAccum = 0;\n",
              "two-finger-reset")
          replace_regex_once(
              r"(?m)^([ \t]*)if \(remainingTouchCount === 0\) \{\n([ \t]*)this\._activeTouchIdentifier = null; this\._isTwoFingerGesture = false;\n([ \t]*)this\._touchScrollLastCentroid = null;\n",
              lambda m: m.group(0) + m.group(3) + "this._touchScrollLastDistance = null;\n" + m.group(3) + "this._touchGestureMode = null;\n" + m.group(3) + "this._touchPinchAccum = 0;\n" + m.group(3) + "this._singleTouchScrollAccumY = 0;\n" + m.group(3) + "this._singleTouchScrollAccumX = 0;\n" + m.group(3) + "this._isSingleFingerScroll = false;\n",
              "all-touch-reset")
          s = "console.info('ABS_MOBILE_TOUCH_GESTURES_V1');\n" + s
          p.write_text(s)
          print("PASS | Patched direct touch: one-finger swipe scrolls, two-finger pinch sends Ctrl+wheel zoom, two-finger translation scrolls, taps and long-press remain.")

          PY
          # Auto-open Android's native keyboard when the user taps Chromium's remote address/search bar.
          # Selkies already has a hidden IME assist field; focus it only for taps in the remote toolbar band.
          python3 - <<'PY'
          from pathlib import Path
          p = Path.home() / "abs-browser/selkies-source/addons/selkies-dashboard/src/components/Sidebar.jsx"
          s = p.read_text()
          anchor = "  const populateAudioDevices = useCallback(async () => {"
          if s.count(anchor) != 1:
              raise SystemExit(f"FAIL | Sidebar keyboard insertion anchor expected once, found {s.count(anchor)}")
          insert = """  // ABS_MOBILE_AUTO_KEYBOARD_V1: let the phone keyboard open when the remote browser or a webpage input gets focus.
          // ABS_MOBILE_FOCUS_BRIDGE_V1 reports only whether a page text field is focused; it cannot execute browser commands.
          useEffect(() => {
            console.info('ABS_MOBILE_AUTO_KEYBOARD_V1');
            console.info('ABS_MOBILE_FOCUS_BRIDGE_V1');
            const overlay = document.getElementById('overlayInput');
            if (!overlay) return;
            let start = null;
            const onDown = (event) => {
              start = { x: event.clientX, y: event.clientY, at: Date.now() };
            };
            const onUp = (event) => {
              const origin = start;
              start = null;
              if (!origin) return;
              const dx = event.clientX - origin.x;
              const dy = event.clientY - origin.y;
              if ((dx * dx + dy * dy) > 144 || Date.now() - origin.at > 700) return;
              const rect = overlay.getBoundingClientRect();
              if (!rect.height) return;
              const y = (event.clientY - rect.top) / rect.height;
              window.setTimeout(async () => {
                // Browser omnibox/tab strip: Chrome's browser chrome is remote pixels, so use Selkies' native IME bridge.
                if (y >= 0.035 && y <= 0.135) {
                  handleShowVirtualKeyboard();
                  return;
                }
                // Web-page input fields: ask the private host bridge if Chromium has focused a text-entry element.
                try {
                  const response = await fetch('/abs-keyboard-focus', {
                    credentials: 'same-origin',
                    cache: 'no-store',
                    signal: AbortSignal.timeout(900)
                  });
                  if (!response.ok) return;
                  const state = await response.json();
                  if (state && state.focused === true) handleShowVirtualKeyboard();
                } catch (_) {}
              }, 180);
            };
            overlay.addEventListener('pointerdown', onDown, { passive: true });
            overlay.addEventListener('pointerup', onUp, { passive: true });
            overlay.addEventListener('pointercancel', () => { start = null; }, { passive: true });
            return () => {
              overlay.removeEventListener('pointerdown', onDown);
              overlay.removeEventListener('pointerup', onUp);
            };
          }, [handleShowVirtualKeyboard]);

          const populateAudioDevices = useCallback(async () => {"""
          s = s.replace(anchor, insert, 1)
          p.write_text(s)
          print("PASS | Added automatic native keyboard focus for taps in the remote Chromium address/search bar.")
          PY
          # Read-only focus bridge: reports only whether a remote page has a focused text-entry element.
          # It never exposes DevTools or accepts navigation/command requests.
          NODE_BIN="$(command -v node)"
          [ -x "$NODE_BIN" ] || { fail "Node.js unavailable for private keyboard focus bridge; browser left unchanged."; exit 1; }
          cat > "$HOME/abs-browser/mobile-keyboard-bridge.js" <<'NODE'
          const http = require('node:http');
          const EXP = "(() => { const e=document.activeElement; if (!e || document.visibilityState !== 'visible') return false; const tag=(e.tagName||'').toUpperCase(); const type=(e.type||'text').toLowerCase(); const excluded=['button','checkbox','radio','submit','reset','file','image','color','range','hidden']; const textInput=tag==='TEXTAREA' || (tag==='INPUT' && !excluded.includes(type)) || e.isContentEditable===true; return !!(textInput && document.hasFocus()); })()";
          async function focusedTarget(target) {
            if (!target.webSocketDebuggerUrl) return false;
            return await new Promise((resolve) => {
              let done = false;
              let ws;
              const finish = (value) => { if (done) return; done = true; clearTimeout(timer); try { if (ws) ws.close(); } catch (_) {} resolve(value); };
              const timer = setTimeout(() => finish(false), 650);
              try { ws = new WebSocket(target.webSocketDebuggerUrl); } catch (_) { finish(false); return; }
              ws.addEventListener('open', () => {
                try { ws.send(JSON.stringify({id: 1, method: 'Runtime.evaluate', params: {expression: EXP, returnByValue: true, awaitPromise: false}})); }
                catch (_) { finish(false); }
              }, {once:true});
              ws.addEventListener('message', (event) => {
                try {
                  const message = JSON.parse(String(event.data));
                  if (message.id === 1) finish(message.result?.result?.value === true);
                } catch (_) { finish(false); }
              });
              ws.addEventListener('error', () => finish(false), {once:true});
              ws.addEventListener('close', () => finish(false), {once:true});
            });
          }
          const server = http.createServer(async (req, res) => {
            const path = new URL(req.url, 'http://127.0.0.1').pathname;
            res.setHeader('Content-Type','application/json; charset=utf-8');
            res.setHeader('Cache-Control','no-store');
            res.setHeader('X-Content-Type-Options','nosniff');
            if (req.method !== 'GET' || !['/health','/focus','/abs-keyboard-focus'].includes(path)) {
              res.writeHead(404); res.end(JSON.stringify({error:'not_found'})); return;
            }
            if (path === '/health') {
              res.writeHead(200); res.end(JSON.stringify({ok:true,service:'abs-browser-keyboard-focus'})); return;
            }
            try {
              const response = await fetch('http://127.0.0.1:9222/json/list', {signal:AbortSignal.timeout(700)});
              if (!response.ok) throw new Error('cdp_unavailable');
              const targets = (await response.json()).filter(t => t.type === 'page' && /^https?:/.test(t.url || '') && t.webSocketDebuggerUrl).slice(0,8);
              const states = await Promise.all(targets.map(focusedTarget));
              res.writeHead(200); res.end(JSON.stringify({focused:states.some(Boolean)}));
            } catch (_) {
              res.writeHead(200); res.end(JSON.stringify({focused:false}));
            }
          });
          server.listen(9223, '127.0.0.1');
          NODE
          chmod 600 "$HOME/abs-browser/mobile-keyboard-bridge.js"
          sudo -n tee /etc/systemd/system/abs-browser-keyboard-bridge.service >/dev/null <<UNIT
          [Unit]
          Description=ABS Browser private mobile keyboard focus bridge
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=absadmin
          Group=absadmin
          WorkingDirectory=/home/absadmin/abs-browser
          ExecStart=$NODE_BIN /home/absadmin/abs-browser/mobile-keyboard-bridge.js
          Restart=always
          RestartSec=2
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now abs-browser-keyboard-bridge.service
          for i in $(seq 1 10); do curl -fsS --max-time 2 http://127.0.0.1:9223/health >/dev/null && break; sleep 1; done
          curl -fsS --max-time 3 http://127.0.0.1:9223/health | grep -q 'abs-browser-keyboard-focus' || { fail "Private keyboard focus bridge failed health check; browser left unchanged."; exit 1; }
          pass "Private keyboard focus bridge is healthy on loopback only."
          if command -v tailscale >/dev/null 2>&1 && timeout 8s sudo -n tailscale status --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("BackendState")=="Running" else 1)'; then
            sudo -n tailscale serve --bg --yes --set-path=/abs-keyboard-focus http://127.0.0.1:9223 >/dev/null 2>&1 || { fail "Could not add private Tailscale Serve route for keyboard focus; existing browser remains running."; exit 1; }
            timeout 8s sudo -n tailscale serve status 2>&1 | grep -q '9223' || { fail "Tailscale Serve route did not confirm loopback focus bridge; existing browser remains running."; exit 1; }
            pass "Private Tailscale path /abs-keyboard-focus routes only to the loopback focus-status endpoint."
          else
            fail "Tailscale is not connected; automatic keyboard for webpage fields cannot be activated safely."
            exit 1
          fi
          export NODE_OPTIONS=--max-old-space-size=1024
          (cd "$CORE_DIR" && npm ci --no-audit --no-fund && npm run build)
          (cd "$DASH_DIR" && npm ci --no-audit --no-fund && npm run build)
          CURRENT_ASSET_DIR="/lsiopy/lib/python3.13/site-packages/selkies/selkies_web/assets"
          CURRENT_BUNDLE="$(sudo -n docker exec abs-browser-ui sh -lc 'find /lsiopy/lib/python3.13/site-packages/selkies/selkies_web/assets -maxdepth 1 -type f -name "selkies-core-*.js" | head -n 1' | tr -d '\r')"
          [ -n "$CURRENT_BUNDLE" ] || { fail "Could not identify the active Selkies core asset; existing browser remains running."; exit 1; }
          BUNDLE_NAME="$(basename "$CURRENT_BUNDLE")"
          BUILT_BUNDLE="$(find "$DASH_DIR/dist" -type f -name 'selkies-core-*.js' | head -n 1)"
          [ -s "$BUILT_BUNDLE" ] || { fail "Patched Selkies core bundle was not produced; existing browser remains running."; exit 1; }
          grep -q 'ABS_MOBILE_TOUCH_GESTURES_V1' "$BUILT_BUNDLE" || { fail "Build output does not contain the mobile gesture patch marker; existing browser remains running."; exit 1; }
          CURRENT_DASHBOARD_BUNDLE="$(sudo -n docker exec abs-browser-ui sh -lc 'find /lsiopy/lib/python3.13/site-packages/selkies/selkies_web/assets -maxdepth 1 -type f -name "index-*.js" | head -n 1' | tr -d '\r')"
          [ -n "$CURRENT_DASHBOARD_BUNDLE" ] || { fail "Could not identify the active Selkies dashboard asset; existing browser remains running."; exit 1; }
          DASHBOARD_BUNDLE_NAME="$(basename "$CURRENT_DASHBOARD_BUNDLE")"
          BUILT_DASHBOARD_BUNDLE="$(find "$DASH_DIR/dist/assets" -maxdepth 1 -type f -name 'index-*.js' | head -n 1)"
          [ -s "$BUILT_DASHBOARD_BUNDLE" ] || { fail "Patched dashboard bundle was not produced; existing browser remains running."; exit 1; }
          grep -q 'ABS_MOBILE_AUTO_KEYBOARD_V1' "$BUILT_DASHBOARD_BUNDLE" || { fail "Dashboard build does not contain the auto-keyboard patch marker; existing browser remains running."; exit 1; }
          grep -q 'ABS_MOBILE_FOCUS_BRIDGE_V1' "$BUILT_DASHBOARD_BUNDLE" || { fail "Dashboard build does not contain the webpage-focus bridge marker; existing browser remains running."; exit 1; }
          OVERLAY_DIR="$HOME/abs-browser/selkies-mobile-overlay-$(date -u +%Y%m%d%H%M%S)"
          install -d -m 755 "$OVERLAY_DIR"
          cp "$BUILT_BUNDLE" "$OVERLAY_DIR/$BUNDLE_NAME"
          chmod 644 "$OVERLAY_DIR/$BUNDLE_NAME"
          CUSTOM_BUNDLE_HOST="$OVERLAY_DIR/$BUNDLE_NAME"
          cp "$BUILT_DASHBOARD_BUNDLE" "$OVERLAY_DIR/$DASHBOARD_BUNDLE_NAME"
          chmod 644 "$OVERLAY_DIR/$DASHBOARD_BUNDLE_NAME"
          CUSTOM_DASHBOARD_BUNDLE_HOST="$OVERLAY_DIR/$DASHBOARD_BUNDLE_NAME"
          BUILT_CORE_BASENAME="$(basename "$BUILT_BUNDLE")"
          pass "Built and staged custom Selkies core asset as $BUNDLE_NAME."
          pass "Built and staged custom Selkies dashboard asset as $DASHBOARD_BUNDLE_NAME."
          echo "CustomBundleSHA256=$(sha256sum "$CUSTOM_BUNDLE_HOST" | awk '{print $1}')"
          echo "CustomDashboardSHA256=$(sha256sum "$CUSTOM_DASHBOARD_BUNDLE_HOST" | awk '{print $1}')"
          echo
          # Remove only the custom overlay this project installed; leave the Chromium profile and all site data untouched.
          if [ -d "$PROFILE_MOUNT/abs-mobile-zoom" ]; then
            rm -rf -- "$PROFILE_MOUNT/abs-mobile-zoom"
            pass "Removed custom floating zoom-button extension; browsing profile retained."
          else
            pass "No custom floating zoom extension present."
          fi

          sudo -n docker stop abs-browser-ui >/dev/null
          sudo -n docker rename abs-browser-ui "$ROLLBACK_NAME"
          OLD_RENAMED=1
          sudo -n docker run -d \
            --name abs-browser-ui \
            --network host \
            --restart unless-stopped \
            --security-opt no-new-privileges:true \
            --cap-drop NET_RAW \
            --memory 1280m --memory-swap 1792m --cpus 1.50 --pids-limit 512 \
            --shm-size 512m \
            --env-file "$ENVFILE" \
            -e PUID="$(id -u)" -e PGID="$(id -g)" -e TZ=America/Sao_Paulo \
            -e LANG=pt_BR.UTF-8 -e LANGUAGE=pt_BR:pt -e LC_ALL=pt_BR.UTF-8 \
            -e SELKIES_SCALING_DPI=120 \
            -e SELKIES_ENABLE_CURSORS=false \
            -e SELKIES_USE_BROWSER_CURSORS=true \
            -e SELKIES_UI_SIDEBAR_SHOW_TRACKPAD=true \
            -e SELKIES_UI_SIDEBAR_SHOW_FULLSCREEN=true \
            -e SELKIES_UI_SIDEBAR_SHOW_KEYBOARD_BUTTON=true \
            -e SELKIES_UI_SIDEBAR_SHOW_SOFT_BUTTONS=true \
            -e CHROME_CLI="--user-data-dir=/config/chromium-abs-profile --remote-debugging-port=9222 --enable-touch-events --touch-events=enabled --window-size=412,915 --force-device-scale-factor=1 --lang=pt-BR --accept-lang=pt-BR,pt,en-US,en" \
            -v "$PROFILE_MOUNT:/config" \
            -v "$CUSTOM_BUNDLE_HOST:$CURRENT_ASSET_DIR/$BUNDLE_NAME:ro" \
            -v "$CUSTOM_BUNDLE_HOST:$CURRENT_ASSET_DIR/$BUILT_CORE_BASENAME:ro" \
            -v "$CUSTOM_DASHBOARD_BUNDLE_HOST:$CURRENT_ASSET_DIR/$DASHBOARD_BUNDLE_NAME:ro" \
            "$IMAGE" >/dev/null

          READY=0
          for i in $(seq 1 24); do
            STATE="$(sudo -n docker inspect abs-browser-ui --format '{{.State.Status}}' 2>/dev/null || true)"
            HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:3000/ 2>/dev/null || true)"
            CDP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:9222/json/version 2>/dev/null || true)"
            if [ "$STATE" = running ] && printf '%s' "$HTTP_CODE" | grep -Eq '^(200|301|302|401|403)$' && [ "$CDP_CODE" = "200" ]; then READY=1; break; fi
            sleep 5
          done
          [ "$READY" -eq 1 ] || { fail "New browser did not become ready; rollback will restore prior container."; exit 1; }
          pass "Browser UI and DevTools are healthy; HTTP=$HTTP_CODE CDP=$CDP_CODE."

          ARGS="$(sudo -n docker exec abs-browser-ui sh -lc 'ps -eo args | grep -E "[c]hromium" | head -n 2' 2>/dev/null || true)"
          printf '%s\n' "$ARGS" | grep -F -- '--enable-touch-events' >/dev/null || { fail "Chromium touch events are not enabled."; exit 1; }
          if printf '%s\n' "$ARGS" | grep -F -- '--load-extension=/config/abs-mobile-zoom' >/dev/null; then
            fail "The custom zoom overlay is still loaded."; exit 1
          fi
          pass "Chromium touch events enabled; injected zoom overlay is not loaded."
          PATCHED_BUNDLE_SHA="$(sudo -n docker exec abs-browser-ui sha256sum "$CURRENT_ASSET_DIR/$BUNDLE_NAME" | awk '{print $1}')"
          HOST_BUNDLE_SHA="$(sha256sum "$CUSTOM_BUNDLE_HOST" | awk '{print $1}')"
          [ "$PATCHED_BUNDLE_SHA" = "$HOST_BUNDLE_SHA" ] || { fail "Mounted mobile gesture bundle SHA256 mismatch; rollback will restore prior browser."; exit 1; }
          pass "Runtime is serving the persistent custom Selkies core bundle (SHA256 verified): one-finger scroll and pinch-to-zoom patch loaded."
          DASH_BUNDLE_SHA="$(sudo -n docker exec abs-browser-ui sha256sum "$CURRENT_ASSET_DIR/$DASHBOARD_BUNDLE_NAME" | awk '{print $1}')"
          HOST_DASH_BUNDLE_SHA="$(sha256sum "$CUSTOM_DASHBOARD_BUNDLE_HOST" | awk '{print $1}')"
          [ "$DASH_BUNDLE_SHA" = "$HOST_DASH_BUNDLE_SHA" ] || { fail "Mounted dashboard bundle SHA256 mismatch; rollback will restore prior browser."; exit 1; }
          grep -q 'ABS_MOBILE_AUTO_KEYBOARD_V1' "$CUSTOM_DASHBOARD_BUNDLE_HOST" || { fail "Auto-keyboard marker missing from staged dashboard bundle."; exit 1; }
          pass "Runtime dashboard bundle includes the automatic mobile address/search-bar keyboard trigger (SHA256 verified)."
          printf "%s\\n" "$ARGS" | grep -F -- "--lang=pt-BR" >/dev/null || { fail "Portuguese (Brazil) browser locale flag is missing."; exit 1; }
          pass "Chromium configured for Portuguese (Brazil), including Accept-Language."
          pass "Synthetic remote cursor rendering is disabled; CSS cursor handling is enabled to avoid Selkies drawing a desktop cursor over direct touch."
          curl -fsS --max-time 8 http://127.0.0.1:8787/health >/dev/null || { fail "ABS health regression; rollback will restore previous container."; exit 1; }
          pass "ABS health regression passed."
          curl -fsS --max-time 8 http://127.0.0.1:11434/api/tags >/dev/null && pass "Ollama regression passed." || echo "INFO | Ollama probe unavailable; browser remains isolated."

          sudo -n docker rm "$ROLLBACK_NAME" >/dev/null
          OLD_RENAMED=0
          pass "New browser passed checks; prior container removed. Persistent profile remains intact."
          if command -v tailscale >/dev/null 2>&1 && timeout 8s sudo -n tailscale status --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("BackendState")=="Running" else 1)'; then
            sudo -n tailscale serve --bg --yes http://127.0.0.1:3000 >/dev/null 2>&1 || true
            sudo -n tailscale serve status 2>&1 | head -n 8 || true
            pass "Private Tailscale Serve retained; no public port opened."
          else
            echo "INFO | Tailscale is not connected from the VPS; no firewall changes made."
          fi
          echo "PASS | Custom Selkies input now maps one-finger swipes to scroll and two-finger pinches to Ctrl+wheel zoom; two-finger translation scrolls. Physical-device gesture feel still depends on the phone browser and should be verified during normal use."
          echo "ABS BROWSER MOBILE NATIVE INTERACTION FINISHED"

      - name: Publish report
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.apply.outputs.result }}
        with:
          script: |
            const body = [
              '### ABS BROWSER MOBILE NATIVE INTERACTION — REPORT',
              '',
              (process.env.RESULT || 'No final report produced; inspect private Actions logs.').slice(0, 9000),
              '',
              'No browser credential values are included.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
