name: Validar Cérebro — BASE V0.2

on:
  push:
    branches: [main, base-cerebro-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip jsonschema pytest

      - name: Validar estado versionado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cerebro.estado import validar_estado
          path = Path("cerebro/especificacao/ESTADO_SISTEMA_V0_1.json")
          dados = json.loads(path.read_text(encoding="utf-8"))
          erros = validar_estado(dados)
          if erros:
              raise SystemExit("Estado inválido: " + "; ".join(erros))
          print("Estado versionado: OK")
          PY

      - name: Executar suíte completa
        run: pytest -q tests cerebro/tests

      - name: Verificar importação do núcleo
        run: python -c "from cerebro.servico import Cerebro; print(Cerebro().diagnostico())"

      - name: Gerar evidência operacional
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .github/evidencias
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from cerebro.github_controle import correlation_id, idempotency_key

          repo = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["GITHUB_REF_NAME"]
          commit = os.environ["GITHUB_SHA"]
          workflow = os.environ["GITHUB_WORKFLOW"]
          status = os.environ["JOB_STATUS"]
          data = {
              "schema_version": "0.1",
              "event_type": "workflow.validation",
              "repository": repo,
              "ref": ref,
              "commit": commit,
              "workflow": workflow,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job_status": status,
              "correlation_id": correlation_id(repo, ref, commit, os.environ["GITHUB_RUN_ID"]),
              "idempotency_key": idempotency_key(repo, ref, "workflow.validation"),
          }
          Path(".github/evidencias/validacao.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Publicar evidência da validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-validacao-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/evidencias/validacao.json
          if-no-files-found: error
          retention-days: 30

      - name: Registrar retorno
        if: always()
        run: |
          {
            echo "## Resultado da validação"
            echo "- Status: ${{ job.status }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Run: ${{ github.run_id }}"
            echo "- Tentativa: ${{ github.run_attempt }}"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Evidência: evidencia-validacao-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "- Data UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
