name: Validar Cérebro — BASE V0.1

on:
  push:
    branches: [main, base-cerebro-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip jsonschema pytest

      - name: Executar testes
        run: pytest -q tests/test_base_structure.py tests/test_ingestao.py tests/test_calibracao.py

      - name: Registrar retorno
        if: always()
        run: |
          {
            echo "## Resultado da validação"
            echo "- Status: ${{ job.status }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Data UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
