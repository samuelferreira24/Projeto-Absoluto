name: Validar Cérebro — BASE V0.1

on:
  push:
    branches: [main, base-cerebro-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validar-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estrutura e contratos
        run: python tests/test_base_structure.py
