name: Project Knowledge Sync
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, closed, synchronize, reopened, ready_for_review]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Generate observable knowledge and test evidence
        run: python scripts/project_knowledge_sync.py
      - name: Commit generated projections only
        run: |
          if git diff --quiet -- continuidade/07_conhecimento/project_knowledge.json continuidade/07_conhecimento/MAPA_AUTO_ESTADO_PROJETO.md; then
            echo "Project Knowledge already current."
            exit 0
          fi
          if git diff --name-only | grep -Ev '^continuidade/07_conhecimento/(project_knowledge.json|MAPA_AUTO_ESTADO_PROJETO.md)$'; then
            echo "Unexpected non-projection change detected; refusing to commit."
            exit 1
          fi
          git config user.name "Projeto Absoluto Knowledge Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuidade/07_conhecimento/project_knowledge.json continuidade/07_conhecimento/MAPA_AUTO_ESTADO_PROJETO.md
          git commit -m "chore: refresh project knowledge [skip ci]"
          git push
