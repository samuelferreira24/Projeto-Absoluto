name: ABS Replace Port 3010 with Remote Browser

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-remote-browser-install
  cancel-in-progress: false

jobs:
  replace:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 121 &&
      github.event.comment.user.login == 'samuelferreira24' &&
      github.event.comment.body == '/abs-browser replace-3010'
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 15
    steps:
      - name: Replace only the identified legacy interface with Remote Browser
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/abs-remotebrowser-replace.txt"
          exec > >(tee "$REPORT") 2>&1
          pass(){ echo "PASS | $*"; }
          fail(){ echo "FAIL | $*"; exit 1; }
          HOST_IP="100.119.8.119"
          UNIT="abs-browser-mobile-webapp.service"
          UNITFILE="/etc/systemd/system/$UNIT"
          DISABLED="/etc/systemd/system/$UNIT.disabled-rollback"
          [ "$(hostname)" = "abs-vps-01" ] || fail "Unexpected host; no changes made."
          sudo -n docker info >/dev/null
          ip -4 -o addr show tailscale0 | awk '{print $4}' | cut -d/ -f1 | grep -Fxq "$HOST_IP" || fail "Expected Tailscale IP is not assigned."
          curl -fsS --max-time 8 http://127.0.0.1:8787/health >/dev/null || fail "ABS health failed."
          [ -f "$UNITFILE" ] || fail "Expected old interface systemd unit not found; no changes made."
          [ ! -e "$DISABLED" ] || fail "Rollback unit file already exists; refusing to overwrite."
          PID="$(sudo -n systemctl show "$UNIT" -p MainPID --value)"
          [ -n "$PID" ] && [ "$PID" != "0" ] || fail "Legacy interface service is not running; no changes made."
          LISTENER="$(sudo -n ss -ltnp 'sport = :3010' | grep -F "pid=$PID," || true)"
          [ -n "$LISTENER" ] || fail "Port 3010 is not owned by the expected mobile-webapp service; no changes made."
          echo "[legacy service identified]"
          echo "unit=$UNIT pid=$PID"
          sudo -n systemctl status "$UNIT" --no-pager -l | head -n 18
          echo
          echo "[checking candidate image]"
          if ! sudo -n docker image inspect abs-remotebrowser:yvonuk-main >/dev/null 2>&1; then
            WORK="$HOME/abs-remotebrowser-upstream"
            [ -d "$WORK/.git" ] || git clone --depth 1 https://github.com/yvonuk/remotebrowser.git "$WORK"
            cat > "$WORK/Dockerfile.abs" <<'DOCKER'
          FROM mcr.microsoft.com/playwright:v1.62.1-noble
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY . .
          RUN npm run build && mkdir -p logs && chown -R pwuser:pwuser /app
          USER pwuser
          EXPOSE 3000
          CMD ["npm","start"]
          DOCKER
            sudo -n docker build --pull -f "$WORK/Dockerfile.abs" -t abs-remotebrowser:yvonuk-main "$WORK"
          fi
          # Disable the old interface while preserving its unit and files for rollback.
          sudo -n systemctl stop "$UNIT"
          sudo -n systemctl disable "$UNIT"
          sudo -n mv "$UNITFILE" "$DISABLED"
          sudo -n systemctl daemon-reload
          for i in $(seq 1 10); do
            if ! sudo -n ss -ltn 'sport = :3010' | grep -q LISTEN; then break; fi
            sleep 1
          done
          if sudo -n ss -ltn 'sport = :3010' | grep -q LISTEN; then
            sudo -n mv "$DISABLED" "$UNITFILE"
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now "$UNIT"
            fail "Port 3010 remained occupied; legacy service restored."
          fi
          sudo -n docker rm -f abs-remotebrowser >/dev/null 2>&1 || true
          if ! sudo -n docker run -d --name abs-remotebrowser --restart unless-stopped --memory=2g --cpus=2 --pids-limit=512 --shm-size=1g -p "$HOST_IP:3010:3000" abs-remotebrowser:yvonuk-main; then
            sudo -n mv "$DISABLED" "$UNITFILE"
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now "$UNIT"
            fail "Remote Browser container failed to start; legacy service restored."
          fi
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 "http://$HOST_IP:3010/" >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            sudo -n docker logs --tail 100 abs-remotebrowser || true
            sudo -n docker rm -f abs-remotebrowser || true
            sudo -n mv "$DISABLED" "$UNITFILE"
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now "$UNIT"
            fail "Remote Browser UI health failed; legacy service restored."
          fi
          curl -fsS --max-time 20 "http://$HOST_IP:3010/api/session?sessionId=abs-final-smoke-test" > "$RUNNER_TEMP/abs-remotebrowser-final.json" || {
            sudo -n docker rm -f abs-remotebrowser || true
            sudo -n mv "$DISABLED" "$UNITFILE"
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now "$UNIT"
            fail "Chromium session smoke test failed; legacy service restored."
          }
          python3 - "$RUNNER_TEMP/abs-remotebrowser-final.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get("sessionId") == "abs-final-smoke-test", d
          assert isinstance(d.get("tabs"), list), d
          print("PASS | Chromium session API created a browser session.")
          PY
          curl -fsS --max-time 8 http://127.0.0.1:8787/health >/dev/null || fail "ABS health regression after install."
          pass "Remote Browser is live on the requested private address."
          pass "Legacy mobile web interface is stopped and disabled; unit and files retained for rollback."
          pass "Existing Selkies Chromium service and profile were not changed."
          echo "URL=http://$HOST_IP:3010/"
          echo "NOTE | New Remote Browser has a separate Chromium profile; existing Selkies cookies remain in the old browser and are not copied."
          echo "NOTE | HTTP UI and Chromium session API passed. Real Android touch/keyboard/pinch still need user validation."
      - name: Report result
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ runner.temp }}/abs-remotebrowser-replace.txt
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync(process.env.REPORT_FILE) ? fs.readFileSync(process.env.REPORT_FILE, 'utf8') : 'No replacement report was produced.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### REMOTE BROWSER PORT 3010 REPLACEMENT\n\n' + report.slice(-10000)
            });
