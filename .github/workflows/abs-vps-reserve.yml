name: ABS VPS Reserve Channel

on:
  issue_comment:
    types: [created]

concurrency:
  group: abs-vps-reserve
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  execute-reserve:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'samuelferreira24' &&
      startsWith(github.event.comment.body, '/abs-reserve ')
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 10
    steps:
      - name: Execute reserve command
        id: command
        shell: bash
        env:
          REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          command="${REQUEST#'/abs-reserve '}"
          case "$command" in
            runner-main-diagnose)
              service="actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01.service"
              {
                echo "[unit]"
                sudo systemctl show "$service" -p ActiveState -p SubState -p Result -p MainPID -p Restart -p RestartUSec -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemorySwapMax -p KillMode -p TimeoutStopUSec
                echo
                echo "[status]"
                sudo systemctl status "$service" --no-pager -l || true
                echo
                echo "[journal]"
                sudo journalctl -u "$service" -n 50 --no-pager || true
                echo
                echo "[processes]"
                pgrep -af 'Runner.Listener|Runner.Worker|runsvc.sh' || true
                echo
                echo "[ABS health]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/health || true
                echo
                echo "[memory]"
                free -h
              } > /tmp/abs-main-runner-diagnose.txt 2>&1
              result="$(cat /tmp/abs-main-runner-diagnose.txt)"
              ;;
            runner-stabilize-main)
              service="actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01.service"
              sudo install -d -m 0755 "/etc/systemd/system/$service.d"
              sudo tee "/etc/systemd/system/$service.d/override.conf" >/dev/null <<'UNIT'
          [Service]
          Restart=on-failure
          RestartSec=30
          MemoryAccounting=yes
          MemoryMax=1G
          MemorySwapMax=512M
          KillMode=control-group
          TimeoutStopSec=60
          UNIT
              sudo systemctl daemon-reload
              echo "[stopping stale main runner cgroup]"
              sudo systemctl stop "$service" || true
              sleep 3
              sudo systemctl reset-failed "$service" || true
              echo "[starting main runner]"
              sudo systemctl start "$service"
              sleep 5
              result="$(sudo systemctl show "$service" -p ActiveState -p SubState -p Result -p Restart -p RestartUSec -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemorySwapMax -p KillMode -p TimeoutStopUSec; echo; curl -fsS --max-time 10 http://127.0.0.1:8787/health; echo; free -h)"
              ;;
            status)
              result="$(hostname; echo; uptime -p; echo; free -h; echo; df -h /; echo; sudo systemctl is-active abs.service || true)"
              ;;
            restart-abs)
              sudo systemctl restart abs.service
              sleep 2
              result="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              ;;
            v3-test|integrate-test)
              cd "$HOME/Projeto-Absoluto"
              git fetch origin main --quiet
              git reset --hard origin/main --quiet
              python3 -m compileall -q abs_core
              python3 -m pytest -q tests
              health="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              v3="$(curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status)"
              echo "$health"
              echo "$v3"
              result="ABS RESERVE V3 + HTTP INTEGRATION PASS"
              ;;
            local-ai-test-all)
              result="DISABLED: six-model batch is blocked during runner stabilization. First complete /abs runner-health and /abs-reserve status; then test one model at a time."
              ;;
            *)
              result="Comando não permitido: $command. Use /abs-reserve status, /abs-reserve runner-main-diagnose, /abs-reserve runner-stabilize-main, /abs-reserve restart-abs, /abs-reserve v3-test ou /abs-reserve integrate-test."
              ;;
          esac
          {
            echo 'result<<ABS_RESULT_EOF'
            printf '%s\n' "$result"
            echo 'ABS_RESULT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report result
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.command.outputs.result }}
          REQUEST: ${{ github.event.comment.body }}
        with:
          script: |
            const body = [
              '### ABS VPS RESERVE',
              '',
              'COMMAND_MARKER' + (process.env.REQUEST || '') + 'COMMAND_MARKER',
              '',
              'OUTPUT_START',
              (process.env.RESULT || '(sem saída)').slice(0, 12000),
              'OUTPUT_END'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
