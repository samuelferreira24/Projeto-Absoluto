name: ABS VPS Reserve Channel

on:
  issue_comment:
    types: [created]

concurrency:
  group: abs-vps-shared-tree
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  execute-reserve:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'samuelferreira24' &&
      startsWith(github.event.comment.body, '/abs-reserve ')
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 10
    steps:
      - name: Execute reserve command
        id: command
        shell: bash
        env:
          REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          command="${REQUEST#'/abs-reserve '}"
          case "$command" in
            runner-main-diagnose)
              service="actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01.service"
              {
                echo "[unit]"
                sudo systemctl show "$service" -p ActiveState -p SubState -p Result -p MainPID -p Restart -p RestartUSec -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemorySwapMax -p KillMode -p TimeoutStopUSec
                echo
                echo "[status]"
                sudo systemctl status "$service" --no-pager -l || true
                echo
                echo "[journal]"
                sudo journalctl -u "$service" -n 50 --no-pager || true
                echo
                echo "[processes]"
                pgrep -af 'Runner.Listener|Runner.Worker|runsvc.sh' || true
                echo
                echo "[ABS health]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/health || true
                echo
                echo "[memory]"
                free -h
              } > /tmp/abs-main-runner-diagnose.txt 2>&1
              result="$(cat /tmp/abs-main-runner-diagnose.txt)"
              ;;
            runner-stabilize-main)
              service="actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01.service"
              sudo install -d -m 0755 "/etc/systemd/system/$service.d"
              sudo tee "/etc/systemd/system/$service.d/override.conf" >/dev/null <<'UNIT'
          [Service]
          Restart=on-failure
          RestartSec=30
          MemoryAccounting=yes
          MemoryMax=1G
          MemorySwapMax=512M
          KillMode=control-group
          TimeoutStopSec=60
          UNIT
              sudo systemctl daemon-reload
              echo "[stopping stale main runner cgroup]"
              sudo systemctl stop "$service" || true
              sleep 3
              sudo systemctl reset-failed "$service" || true
              echo "[starting main runner]"
              sudo systemctl start "$service"
              sleep 5
              result="$(sudo systemctl show "$service" -p ActiveState -p SubState -p Result -p Restart -p RestartUSec -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemorySwapMax -p KillMode -p TimeoutStopUSec; echo; curl -fsS --max-time 10 http://127.0.0.1:8787/health; echo; free -h)"
              ;;
            status)
              result="$(hostname; echo; uptime -p; echo; free -h; echo; df -h /; echo; sudo systemctl is-active abs.service || true)"
              ;;
            restart-abs)
              sudo systemctl restart abs.service
              sleep 2
              result="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              ;;
            v3-test|integrate-test)
              cd "$HOME/Projeto-Absoluto"
              git fetch origin main --quiet
              git reset --hard origin/main --quiet
              python3 -m compileall -q abs_core
              python3 -m pytest -q tests
              health="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              v3="$(curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status)"
              echo "$health"
              echo "$v3"
              result="ABS RESERVE V3 + HTTP INTEGRATION PASS"
              ;;
            local-ai-smoke)
              export HOME=/home/absadmin
              available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
              if [ "$available_kb" -lt 1572864 ]; then
                result="SKIP: MemAvailable below 1.5 GiB; no model started. $(free -h | tail -n 2 | tr '\n' ' ')"
              else
                if out="$(curl -fsS --max-time 45 http://127.0.0.1:11434/api/generate -H 'Content-Type: application/json' -d '{"model":"qwen3.5:0.8b","prompt":"Say LOCAL_AI_OK and nothing else.","stream":false,"think":false,"keep_alive":0,"options":{"num_predict":32,"temperature":0}}')"; then
                  if printf '%s\n' "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("response","").strip().upper(); assert "LOCAL_AI_OK" in s, d; print("ABS_LOCAL_AI_SMOKE_PASS qwen3.5:0.8b; response="+s[:160])'; then
                    result="PASS qwen3.5:0.8b; $(free -h | tail -n 2 | tr '\n' ' ')"
                  else
                    result="FAIL: qwen3.5:0.8b returned unexpected output; $(printf '%s' "$out" | head -c 1500); $(free -h | tail -n 2 | tr '\n' ' ')"
                  fi
                else
                  result="FAIL: Ollama request failed for qwen3.5:0.8b; $(free -h | tail -n 2 | tr '\n' ' ')"
                fi
              fi
              ;;
            local-ai-smoke-qwen2b)
              export HOME=/home/absadmin
              available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
              if [ "$available_kb" -lt 4194304 ]; then
                result="SKIP: MemAvailable below 4 GiB; qwen3.5:2b was not loaded. $(free -h | tail -n 2 | tr '\n' ' ')"
              else
                if out="$(curl -fsS --max-time 120 http://127.0.0.1:11434/api/chat -H 'Content-Type: application/json' -d '{"model":"qwen3.5:2b","messages":[{"role":"user","content":"Say LOCAL_AI_QWEN2B_OK and nothing else."}],"stream":false,"think":false,"keep_alive":0,"options":{"num_predict":16,"temperature":0,"num_ctx":2048}}')"; then
                  if printf '%s\n' "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); s=(d.get("message") or {}).get("content","").strip().upper(); assert "LOCAL_AI_QWEN2B_OK" in s, d; print("ABS_LOCAL_AI_QWEN2B_SMOKE_PASS; response="+s[:120])'; then
                    result="PASS qwen3.5:2b; $(free -h | tail -n 2 | tr '\n' ' ')"
                  else
                    result="FAIL: qwen3.5:2b returned unexpected Ollama chat output; $(printf '%s' "$out" | head -c 1200); $(free -h | tail -n 2 | tr '\n' ' ')"
                  fi
                else
                  result="FAIL: qwen3.5:2b chat request failed; $(free -h | tail -n 2 | tr '\n' ' ')"
                fi
                echo "[active models after keep_alive=0]"
                curl -fsS --max-time 5 http://127.0.0.1:11434/api/ps || true
              fi
              ;;
            local-ai-test-all)
              result="DISABLED: six-model batch is blocked. Use /abs-reserve local-ai-smoke to test one small model at a time."
              ;;
            *)
              result="Comando não permitido: $command. Use /abs-reserve status, /abs-reserve runner-main-diagnose, /abs-reserve runner-stabilize-main, /abs-reserve restart-abs, /abs-reserve v3-test, /abs-reserve integrate-test ou /abs-reserve local-ai-smoke."
              ;;
          esac
          {
            echo 'result<<ABS_RESULT_EOF'
            printf '%s\n' "$result"
            echo 'ABS_RESULT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report result
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.command.outputs.result }}
          REQUEST: ${{ github.event.comment.body }}
        with:
          script: |
            const body = [
              '### ABS VPS RESERVE',
              '',
              'COMMAND_MARKER' + (process.env.REQUEST || '') + 'COMMAND_MARKER',
              '',
              'OUTPUT_START',
              (process.env.RESULT || '(sem saída)').slice(0, 12000),
              'OUTPUT_END'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
