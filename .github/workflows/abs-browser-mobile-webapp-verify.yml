name: ABS Browser Mobile Web App Live Verification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-browser-mobile-webapp-live-verify
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 121 &&
      github.event.comment.user.login == 'samuelferreira24' &&
      github.event.comment.body == '/abs-browser mobile-verify'
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 5
    steps:
      - name: Verify private URL, health, active page and live stream
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/abs-browser-mobile-live-verify.txt"
          install -m 600 /dev/null "$REPORT"
          exec > >(tee -a "$REPORT") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            { echo 'result<<ABS_MOBILE_VERIFY_EOF'; tail -c 7000 "$REPORT"; echo; echo 'ABS_MOBILE_VERIFY_EOF'; } >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          pass(){ printf 'PASS | %s\n' "$*"; }
          fail(){ printf 'FAIL | %s\n' "$*"; }
          [ "$(hostname)" = "abs-vps-01" ] || { fail "Unexpected host; no changes made."; exit 1; }
          [ "$(sudo -n docker inspect abs-browser-ui --format '{{.State.Status}}')" = "running" ] || { fail "Original Chromium container is not running."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:8787/health >/dev/null || { fail "ABS health failed."; exit 1; }
          sudo -n systemctl is-active --quiet abs-browser-mobile-webapp.service || { fail "Mobile mirror systemd service is not active."; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:3010/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True' || { fail "Local mobile mirror health failed."; exit 1; }
          pass "Original browser, ABS and loopback-only mobile mirror are healthy."
          TAILNET_DNS="$(timeout 8s sudo -n tailscale status --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(((d.get("Self") or {}).get("DNSName") or "").rstrip("."))' 2>/dev/null || true)"
          [ -n "$TAILNET_DNS" ] || { fail "Could not read this VPS's Tailscale DNS name."; exit 1; }
          URL="https://\${TAILNET_DNS}/abs-mobile"
          curl -fsS --max-time 10 "$URL/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True' || { fail "Private Tailscale URL health check failed."; exit 1; }
          pass "Private HTTPS URL responds successfully through Tailscale Serve."
          curl -fsS --max-time 10 "$URL/api/state" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("connected") is True and d.get("targetId") and d.get("viewport",{}).get("width",0)>0' || { fail "Private URL cannot retrieve the active Chromium page state."; exit 1; }
          pass "Private URL can read the active Chromium page and viewport."
          APP="$HOME/abs-browser/mobile-webapp" MIRROR_URL="$URL" node <<'NODE'
          const WebSocket=require(process.env.APP+'/node_modules/ws');
          const url=process.env.MIRROR_URL.replace(/^https:/,'wss:')+'/stream';
          const ws=new WebSocket(url,{perMessageDeflate:false,handshakeTimeout:7000});
          let done=false;
          const timer=setTimeout(()=>finish(new Error('No stream frame through the private URL within 12 seconds.')),12000);
          function finish(err){if(done)return;done=true;clearTimeout(timer);try{ws.close();}catch{}if(err){console.error('FAIL | '+err.message);process.exitCode=1;}else console.log('PASS | Actual Chromium frame arrived through the private HTTPS/WebSocket route.');}
          ws.on('message',raw=>{let m;try{m=JSON.parse(raw.toString());}catch{return;}if(m.type==='frame'&&typeof m.data==='string'&&m.data.length>100)finish();if(m.type==='error')finish(new Error(m.message||'Mirror stream error.'));});
          ws.on('error',e=>finish(e));
          NODE
          pass "Live screen stream is available through the private URL."
          echo "PRIVATE_MOBILE_URL=$URL"
          echo "PASS | Verification made no changes to the Chromium container, profile, credentials or firewall."
      - name: Publish sanitized live verification report
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: \${{ steps.verify.outputs.result }}
        with:
          script: |
            const body = [
              '### ABS MOBILE MIRROR — LIVE PRIVATE URL VERIFICATION',
              '',
              (process.env.RESULT || 'No report produced; inspect the self-hosted runner job.').slice(0, 7000),
              '',
              'No browser credentials or tokens are included.'
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
