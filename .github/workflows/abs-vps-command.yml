name: ABS VPS Command Channel

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  execute:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'samuelferreira24' &&
      startsWith(github.event.comment.body, '/abs ')
    runs-on: [self-hosted, abs-vps-01]
    timeout-minutes: 10

    steps:
      - name: Execute allowlisted command
        id: command
        shell: bash
        env:
          REQUEST: ${{ github.event.comment.body }}
        run: |
          set -u
          command="${REQUEST#'/abs '}"
          result=""

          case "$command" in
            install)
              set -e
              if [ ! -d "$HOME/Projeto-Absoluto/.git" ]; then
                git clone https://github.com/samuelferreira24/Projeto-Absoluto.git "$HOME/Projeto-Absoluto"
              else
                git -C "$HOME/Projeto-Absoluto" fetch origin main
                git -C "$HOME/Projeto-Absoluto" reset --hard origin/main
              fi
              sudo tee /etc/systemd/system/abs.service >/dev/null <<'UNIT'
          [Unit]
          Description=ABS Sistema Absoluto
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=absadmin
          WorkingDirectory=/home/absadmin/Projeto-Absoluto
          ExecStart=/usr/bin/python3 -m abs_core.server
          Restart=always
          RestartSec=5
          Environment=PYTHONUNBUFFERED=1

          [Install]
          WantedBy=multi-user.target
          UNIT
              sudo systemctl daemon-reload
              sudo systemctl enable abs.service
              sudo systemctl restart abs.service
              sleep 2
              result="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              ;;
            start)
              cd "$HOME/Projeto-Absoluto"
              git fetch origin main --quiet
              git reset --hard origin/main --quiet
              sudo systemctl enable abs.service
              sudo systemctl restart abs.service
              sleep 2
              result="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              ;;
            v3-test)
              cd "$HOME/Projeto-Absoluto"
              git fetch origin main --quiet
              git reset --hard origin/main --quiet
              set +e
              python3 -m compileall -q abs_core > /tmp/v3-compile.txt 2>&1
              compile_rc=$?
              python3 -m pytest -q tests > /tmp/v3-tests.txt 2>&1
              test_rc=$?
              status="$(curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status 2>&1)"
              {
                echo "[compile_rc] $compile_rc"
                cat /tmp/v3-compile.txt
                echo "[test_rc] $test_rc"
                cat /tmp/v3-tests.txt
                echo "[v3-status]"
                echo "$status"
              } > /tmp/v3-result.txt
              result="$(cat /tmp/v3-result.txt)"
              if [ "$compile_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
                echo "ABS V3 TEST PASS"
              else
                echo "ABS V3 TEST FAIL"
              fi
              ;;
            v3-intelligence-test)
              set -e
              objective_json="$(curl -fsS --max-time 30 -X POST http://127.0.0.1:8787/objective -H 'Content-Type: application/json' -d '{"objective":"Execute a simple ABS operational intelligence integration test. Use the smallest sufficient path and complete the objective.","context":{"approved":false,"capability_id":"echo"}}')"
              python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["type"]=="operational_result" and d["completed"] is True, d; p=d["plan"]; assert p["source"]=="model" and p["intelligence_id"], p; print("ABS V3 OPERATIONAL INTELLIGENCE HTTP PASS"); print(json.dumps(d)[:12000])' <<<"$objective_json"
              result="$objective_json"
              ;;
            v3-local-ai-test)
              set +e
              available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
              if [ "$available_kb" -lt 1572864 ]; then
                result="SKIP: MemAvailable below 1.5 GiB; ABS local model was not called. $(free -h | tail -n 2 | tr '\\n' ' ')"
              else
                chat_json="$(curl -sS --max-time 90 -X POST http://127.0.0.1:8787/chat -H 'Content-Type: application/json' -d '{"message":"Say ABS_LOCAL_AI_OK and nothing else.","approved":true,"context":{"capability_id":"local-ai:qwen3.5-0.8b","max_tokens":32,"temperature":0,"think":false,"keep_alive":0}}' 2>&1)"
                curl_rc=$?
                {
                  echo "[curl_rc] $curl_rc"
                  echo "[chat]"
                  echo "$chat_json"
                  if [ "$curl_rc" -eq 0 ]; then
                    if echo "$chat_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("work_state")=="completed", d; assert "ABS_LOCAL_AI_OK" in str(d.get("response","")).upper(), d; p=d.get("provenance") or {}; assert p.get("capability_id")=="local-ai:qwen3.5-0.8b", p; print("ABS V3 LOCAL AI INTEGRATION PASS")'; then
                      echo "[validation] PASS"
                    else
                      echo "[validation] FAIL"
                    fi
                  else
                    echo "[validation] FAIL: HTTP request did not complete"
                  fi
                  echo
                  free -h
                } > /tmp/abs-v3-local-ai-result.txt
                result="$(cat /tmp/abs-v3-local-ai-result.txt)"
              fi
              ;;
            v3-chat-test)
              set +e
              chat_json="$(curl -sS --max-time 180 -X POST http://127.0.0.1:8787/chat -H 'Content-Type: application/json' -d '{"message":"Reply briefly with ABS_V3_CHAT_OK.","approved":true}' 2>&1)"
              curl_rc=$?
              {
                echo "[curl_rc] $curl_rc"
                echo "[chat]"
                echo "$chat_json"
              } > /tmp/v3-chat-result.txt
              if [ "$curl_rc" -eq 0 ]; then
                python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["work_state"]=="completed", d; assert d.get("response"), d; assert d.get("provenance"), d; print("ABS V3 CHAT PASS")' <<<"$chat_json" && echo "[validation] PASS" >> /tmp/v3-chat-result.txt || echo "[validation] FAIL" >> /tmp/v3-chat-result.txt
              else
                echo "[validation] FAIL: HTTP request did not complete" >> /tmp/v3-chat-result.txt
              fi
              result="$(cat /tmp/v3-chat-result.txt)"
              ;;
            v3-live-test)
              set -e
              work_json="$(curl -fsS --max-time 10 -X POST http://127.0.0.1:8787/works -H 'Content-Type: application/json' -d '{"objective":"ABS V3 LIVE HTTP TEST","context":{"capability_id":"echo","risk":"low"}}')"
              work_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$work_json")"
              run_json="$(curl -fsS --max-time 30 -X POST "http://127.0.0.1:8787/works/$work_id/run" -H 'Content-Type: application/json' -d '{"capability_id":"echo","approved":false}')"
              status="$(curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status)"
              python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["state"]=="completed", d; assert d["result"]["verification"]["accepted"] is True, d; print("ABS V3 LIVE HTTP PASS")' <<<"$run_json"
              result="$(printf 'work_create: %s\nwork_run: %s\nv3_status: %s\n' "$work_json" "$run_json" "$status")"
              ;;
            v2-test)
              set -e
              cd "$HOME/Projeto-Absoluto"
              if ! python3 -m pip --version >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip; fi
              python3 -m pip install --user -q pytest --break-system-packages
              rm -f /tmp/abs-v2-suite.db
              ABS_DB_PATH=/tmp/abs-v2-suite.db python3 -m pytest -q tests
              python3 -m compileall -q abs_core
              result="ABS V2 pytest + compileall PASS"
              ;;
            test)
              set -e
              work_json="$(curl -fsS --max-time 10 -X POST http://127.0.0.1:8787/works -H 'Content-Type: application/json' -d '{"objective":"ABS VPS end-to-end test"}')"
              work_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$work_json")"
              run_json="$(curl -fsS --max-time 10 -X POST "http://127.0.0.1:8787/works/$work_id/run" -H 'Content-Type: application/json' -d '{"capability_id":"echo","approved":false}')"
              health="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              result="$(printf 'health: %s\nwork_create: %s\nwork_run: %s\n' "$health" "$work_json" "$run_json")"
              ;;
            local-ai-test-all)
              result="DISABLED: lote de seis modelos bloqueado para proteger a VPS. Use /abs-reserve local-ai-smoke para validar um modelo por vez; o padrão operacional é qwen3.5:0.8b."
              ;;
            v2-openclaw-work-test)
              set -e
              work_json="$(curl -fsS --max-time 10 -X POST http://127.0.0.1:8787/works -H 'Content-Type: application/json' -d '{"objective":"Reply with exactly ABS_V2_OPENCLAW_WORK_OK","context":{"adaptive":true,"approved":true,"risk":"low"}}')"
              work_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$work_json")"
              run_json="$(curl -fsS --max-time 90 -X POST "http://127.0.0.1:8787/works/$work_id/run" -H 'Content-Type: application/json' -d '{"approved":true}')"
              python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["state"]=="completed", d; r=d["result"]; assert r["executor"]=="openclaw", r; assert r["verification"]["accepted"] is True, r; print("ABS V2 OPENCLAW WORK PASS")' <<<"$run_json"
              result="$run_json"
              ;;
            local-ai-install)
              set -e
              export HOME=/home/absadmin
              export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
              if ! command -v ollama >/dev/null 2>&1; then
                curl -fsSL https://ollama.com/install.sh | sh
              fi
              sudo systemctl enable ollama
              sudo systemctl restart ollama
              sleep 3
              ollama pull qwen3.5:0.8b
              ollama pull qwen3.5:2b
              ollama pull qwen3.5:4b
              ollama pull ministral-3:3b
              ollama pull gemma4:e2b
              ollama pull gemma4:e4b
              sudo sh -c 'printf "%s\\n" "ABS_LOCAL_AI_MODELS=qwen3.5-0.8b|http://127.0.0.1:11434|qwen3.5:0.8b,qwen3.5-2b|http://127.0.0.1:11434|qwen3.5:2b,qwen3.5-4b|http://127.0.0.1:11434|qwen3.5:4b,ministral-3b|http://127.0.0.1:11434|ministral-3:3b,gemma4-e2b|http://127.0.0.1:11434|gemma4:e2b,gemma4-e4b|http://127.0.0.1:11434|gemma4:e4b" "ABS_LOCAL_AI_URL=http://127.0.0.1:11434" "ABS_LOCAL_AI_MODEL=qwen3.5:0.8b" "ABS_LOCAL_AI_MAX_TOKENS=64" "ABS_LOCAL_AI_TEMPERATURE=0" "ABS_LOCAL_AI_THINK=false" > /etc/abs-local-models.env'
              if [ -f /etc/systemd/system/abs.service ]; then
                sudo sed -i '/EnvironmentFile=-\/etc\/abs-local-models.env/d' /etc/systemd/system/abs.service
                sudo sed -i '/^Environment=PYTHONUNBUFFERED=1$/a EnvironmentFile=-/etc/abs-local-models.env' /etc/systemd/system/abs.service
                sudo systemctl daemon-reload
                sudo systemctl restart abs.service
                sleep 3
              fi
              echo "=== OLLAMA ==="
              ollama --version
              echo "=== MODELS ==="
              ollama list
              echo "=== ABS V3 ==="
              curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status
              result="LOCAL_AI_INSTALL_PASS"
              ;;
            openclaw-v2-test)
              set -e
              export HOME=/home/absadmin
              export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.npm/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
              cd "$HOME/Projeto-Absoluto"
              openclaw agent --message "Reply with exactly OPENCLAW_V2_INTEGRATION_OK and nothing else." --json > /tmp/openclaw-v2-test.json
              python3 -c 'import pathlib; s=pathlib.Path("/tmp/openclaw-v2-test.json").read_text(); assert "OPENCLAW_V2_INTEGRATION_OK" in s, "openclaw_v2_expected_text_missing"; print("OPENCLAW V2 INTEGRATION PASS")'
              result="$(cat /tmp/openclaw-v2-test.json | tail -c 12000)"
              ;;
            openclaw-install)
              set -e
              export HOME=/home/absadmin
              export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.npm/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
              if ! command -v node >/dev/null 2>&1 || ! node -e 'process.exit(Number(process.versions.node.split(".")[0]) < 22 ? 1 : 0)'; then
                curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
                sudo apt-get install -y nodejs
              fi
              if ! command -v openclaw >/dev/null 2>&1; then
                sudo npm install -g openclaw@2026.9.8
              fi
              OPENCLAW_BIN="$(command -v openclaw)"
              "$OPENCLAW_BIN" --version > /tmp/openclaw-version.txt
              sudo tee /etc/systemd/system/openclaw-gateway.service >/dev/null <<UNIT
          [Unit]
          Description=OpenClaw Gateway - Projeto Absoluto
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=absadmin
          Group=absadmin
          WorkingDirectory=/home/absadmin
          Environment=HOME=/home/absadmin
          Environment=PATH=/home/absadmin/.local/bin:/home/absadmin/.npm-global/bin:/home/absadmin/.npm/bin:/usr/local/bin:/usr/bin:/bin
          ExecStart=$OPENCLAW_BIN gateway --port 18789
          Restart=always
          RestartSec=5
          TimeoutStopSec=30
          KillMode=control-group

          [Install]
          WantedBy=multi-user.target
          UNIT
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw setup --baseline --workspace /home/absadmin/.openclaw/workspace
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw config set gateway.mode local
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw doctor --generate-gateway-token
              sudo systemctl daemon-reload
              sudo systemctl enable openclaw-gateway.service
              sudo systemctl restart openclaw-gateway.service
              sleep 3
              {
                echo "version: $(cat /tmp/openclaw-version.txt)"
                echo "binary: $OPENCLAW_BIN"
                echo
                sudo systemctl is-active openclaw-gateway.service
                echo
                curl -fsS --max-time 10 http://127.0.0.1:18789/ >/dev/null && echo "gateway_http: reachable" || echo "gateway_http: not-ready"
              } > /tmp/openclaw-vps-result.txt
              result="$(cat /tmp/openclaw-vps-result.txt)"
              ;;
            openclaw-status)
              export HOME=/home/absadmin
              export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.npm/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
              {
                echo "[version]"
                command -v openclaw || true
                openclaw --version 2>&1 || true
                echo
                echo "[service]"
                sudo systemctl status openclaw-gateway.service --no-pager -l || true
                echo
                echo "[gateway]"
                openclaw gateway status --deep 2>&1 || true
                echo
                echo "[models-auth]"
                openclaw models auth list --provider openai --json 2>&1 || true
              } > /tmp/openclaw-vps-result.txt
              result="$(cat /tmp/openclaw-vps-result.txt)"
              ;;
            diagnose)
              { sudo journalctl -u abs.service -n 100 --no-pager 2>&1 || true; echo; cd "$HOME/Projeto-Absoluto"; python3 -c 'import abs_core.v3; print("V3_IMPORT_OK")' 2>&1 || true; } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            abs-status)
              {
                sudo systemctl status abs.service --no-pager -l || true
                echo
                echo "[health]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/health || true
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            help)
              result='Available commands:
          /abs help
          /abs status
          /abs docker
          /abs coolify
          /abs git
          /abs install
          /abs start
          /abs abs-status
          /abs test
          /abs v2-test
          /abs v3-test
          /abs v3-live-test
          /abs v3-local-ai-test
          /abs v3-chat-test
          /abs openclaw-v2-test
          /abs openclaw-install
          /abs openclaw-status
          /abs local-ai-reset
          /abs local-ai-diagnose
          /abs local-ai-status
          /abs runner-health
          /abs runner-diagnose
          /abs runner-repair
          /abs runner-reset-reserve'
              ;;
            local-ai-reset)
              set -e
              service="ollama.service"
              if [ ! -f /etc/abs-local-models.env ]; then
                echo "FAIL: /etc/abs-local-models.env ausente; rode /abs local-ai-install após revisar os modelos instalados."
                exit 1
              fi
              sudo sed -i -e '/^ABS_LOCAL_AI_MODEL=/d' -e '/^ABS_LOCAL_AI_MAX_TOKENS=/d' -e '/^ABS_LOCAL_AI_TEMPERATURE=/d' -e '/^ABS_LOCAL_AI_THINK=/d' /etc/abs-local-models.env
              printf '%s\\n' 'ABS_LOCAL_AI_MODEL=qwen3.5:0.8b' 'ABS_LOCAL_AI_MAX_TOKENS=64' 'ABS_LOCAL_AI_TEMPERATURE=0' 'ABS_LOCAL_AI_THINK=false' | sudo tee -a /etc/abs-local-models.env >/dev/null
              sudo install -d -m 0755 /etc/systemd/system/ollama.service.d
              sudo tee /etc/systemd/system/ollama.service.d/10-abs-memory.conf >/dev/null <<'UNIT'
          [Service]
          Restart=on-failure
          RestartSec=15
          MemoryAccounting=yes
          MemoryHigh=3200M
          MemoryMax=3584M
          MemorySwapMax=1G
          Environment=OLLAMA_KEEP_ALIVE=0
          Environment=OLLAMA_NUM_PARALLEL=1
          Environment=OLLAMA_MAX_LOADED_MODELS=1
          Environment=OLLAMA_CONTEXT_LENGTH=2048
          UNIT
              sudo install -d -m 0755 /etc/systemd/system/abs.service.d
              sudo tee /etc/systemd/system/abs.service.d/10-local-ai-env.conf >/dev/null <<'UNIT'
          [Service]
          EnvironmentFile=-/etc/abs-local-models.env
          UNIT
              sudo systemctl daemon-reload
              echo "[restarting Ollama to clear stale inference and apply limits]"
              sudo systemctl restart "$service"
              sleep 4
              echo "[restarting ABS to load safe default model]"
              sudo systemctl restart abs.service
              sleep 3
              {
                echo "[Ollama limits]"
                sudo systemctl show "$service" -p ActiveState -p SubState -p Result -p Restart -p MemoryCurrent -p MemoryPeak -p MemoryHigh -p MemoryMax -p MemorySwapMax
                echo
                echo "[safe ABS local model config]"
                sudo grep -E '^(ABS_LOCAL_AI_URL|ABS_LOCAL_AI_MODEL|ABS_LOCAL_AI_MAX_TOKENS|ABS_LOCAL_AI_TEMPERATURE|ABS_LOCAL_AI_THINK)=' /etc/abs-local-models.env
                echo
                echo "[Ollama active models: should be empty until requested]"
                curl -fsS --max-time 5 http://127.0.0.1:11434/api/ps
                echo
                echo "[ABS health]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/health
                echo
                echo "[ABS V3 status]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status
                echo
                echo "[memory]"
                free -h
              } > /tmp/abs-local-ai-reset.txt 2>&1
              result="$(cat /tmp/abs-local-ai-reset.txt)"
              ;;
            local-ai-diagnose)
              {
                echo "[Ollama service]"
                sudo systemctl status ollama.service --no-pager -l || true
                echo
                echo "[Ollama recent logs]"
                sudo journalctl -u ollama.service --since "15 minutes ago" -n 100 --no-pager || true
                echo
                echo "[Ollama active models]"
                curl -sS --max-time 5 http://127.0.0.1:11434/api/ps || true
                echo
                echo "[Ollama processes]"
                ps -eo pid,ppid,rss,stat,etime,cmd | grep -E '[o]llama|[l]lama-server' || true
                echo
                echo "[memory]"
                free -h
              } > /tmp/abs-local-ai-diagnose.txt 2>&1
              result="$(cat /tmp/abs-local-ai-diagnose.txt)"
              ;;
            local-ai-status)
              {
                echo "[Ollama service]"
                sudo systemctl show ollama.service -p ActiveState -p SubState -p Result -p MainPID -p MemoryCurrent -p MemoryPeak -p MemoryMax || true
                echo
                echo "[Ollama HTTP tags]"
                curl -sS --max-time 5 http://127.0.0.1:11434/api/tags || true
                echo
                echo "[Ollama active models]"
                curl -sS --max-time 5 http://127.0.0.1:11434/api/ps || true
                echo
                echo "[Ollama processes]"
                ps -eo pid,ppid,rss,stat,etime,cmd | grep -E '[o]llama|[l]lama-server' || true
                echo
                echo "[memory]"
                free -h
              } > /tmp/abs-local-ai-status.txt 2>&1
              result="$(cat /tmp/abs-local-ai-status.txt)"
              ;;
            runner-health)
              {
                echo "[host]"; hostname; id
                echo
                echo "[runner units]"
                sudo systemctl show actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01.service actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01-reserve.service -p Id -p ActiveState -p SubState -p Result -p Restart -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemorySwapMax
                echo
                echo "[ABS health]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/health || true
                echo
                echo "[V3 status]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status || true
                echo
                echo "[memory]"
                free -h
                echo
                echo "[disk]"
                df -h /
                echo
                echo "[runner processes]"
                pgrep -af 'Runner.Listener|Runner.Worker|runsvc.sh' || true
              } > /tmp/abs-vps-result.txt 2>&1
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            runner-diagnose)
              {
                echo "[reserve unit properties]"
                sudo systemctl show actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01-reserve.service -p ActiveState -p SubState -p Result -p Restart -p RestartUSec -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemorySwapMax -p FragmentPath -p DropInPaths || true
                echo
                echo "[reserve status]"
                sudo systemctl status actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01-reserve.service --no-pager -l || true
                echo
                echo "[reserve recent journal]"
                sudo journalctl -u actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01-reserve.service -n 100 --no-pager || true
                echo
                echo "[runner processes]"
                pgrep -af 'Runner.Listener|Runner.Worker|runsvc.sh' || true
                echo
                echo "[memory]"
                free -h
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            runner-repair)
              set -e
              service="actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01-reserve.service"
              {
                echo "[before]"
                sudo systemctl show "$service" -p ActiveState -p SubState -p Result -p MemoryPeak -p MemoryMax -p MemorySwapMax || true
                echo
                echo "[installing bounded restart policy]"
                sudo install -d -m 0755 "/etc/systemd/system/$service.d"
                sudo tee "/etc/systemd/system/$service.d/override.conf" >/dev/null <<'UNIT'
          [Service]
          Restart=on-failure
          RestartSec=60
          MemoryAccounting=yes
          MemoryMax=1G
          MemorySwapMax=512M
          KillMode=control-group
          TimeoutStopSec=60
          UNIT
                sudo systemctl daemon-reload
                sudo systemctl reset-failed "$service"
                sudo systemctl start "$service"
                sleep 5
                echo
                echo "[after]"
                sudo systemctl show "$service" -p ActiveState -p SubState -p Result -p Restart -p RestartUSec -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemorySwapMax -p DropInPaths
                echo
                echo "[recent journal]"
                sudo journalctl -u "$service" -n 30 --no-pager
                echo
                echo "[ABS health]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/health
                echo
                echo "[RAM]"
                free -h
              } > /tmp/abs-vps-result.txt 2>&1
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            runner-reset-reserve)
              set -e
              service="actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01-reserve.service"
              {
                echo "[stopping reserve runner to clear stale/heavy job]"
                sudo systemctl stop "$service" || true
                sleep 3
                echo "[starting reserve runner]"
                sudo systemctl start "$service"
                sleep 5
                echo "[reserve state]"
                sudo systemctl show "$service" -p ActiveState -p SubState -p Result -p Restart -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemorySwapMax
                echo
                echo "[recent journal]"
                sudo journalctl -u "$service" -n 20 --no-pager
                echo
                echo "[ABS health]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/health
                echo
                echo "[RAM]"
                free -h
              } > /tmp/abs-vps-result.txt 2>&1
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            status)
              {
                echo "hostname: $(hostname)"
                echo "user: $(id -un)"
                echo "kernel: $(uname -a)"
                echo "uptime: $(uptime -p 2>/dev/null || true)"
                echo
                echo "[disk]"
                df -h /
                echo
                echo "[memory]"
                free -h
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            docker)
              if command -v docker >/dev/null 2>&1; then
                {
                  echo "docker: $(docker --version 2>&1)"
                  echo
                  docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1
                } > /tmp/abs-vps-result.txt
              else
                echo "docker: not installed or not in PATH" > /tmp/abs-vps-result.txt
              fi
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            coolify)
              {
                echo "[local port 8000]"
                curl -I -sS --max-time 10 http://127.0.0.1:8000 2>&1 | head -n 20 || true
                echo
                echo "[coolify containers]"
                if command -v docker >/dev/null 2>&1; then
                  docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' 2>&1 | grep -i coolify || true
                fi
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            git)
              {
                echo "git: $(git --version 2>&1)"
                if [ -d "$HOME/Projeto-Absoluto/.git" ]; then
                  echo
                  git -C "$HOME/Projeto-Absoluto" status --short --branch 2>&1
                else
                  echo
                  echo "Projeto-Absoluto: not found at $HOME/Projeto-Absoluto"
                fi
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            *)
              result="Comando não permitido: $command. Use /abs help."
              ;;
          esac

          echo "command=$command" >> "$GITHUB_OUTPUT"
          {
            echo 'result<<ABS_RESULT_EOF'
            printf '%s\n' "$result"
            echo 'ABS_RESULT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report result
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.command.outputs.result }}
          REQUEST: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const issue_number = context.issue.number || 121;
            const result = process.env.RESULT || '(sem saída)';
            const request = process.env.REQUEST || '';
            const commentId = process.env.COMMENT_ID || '';
            const body = [
              '### ABS VPS',
              '',
              'COMMAND_MARKER' + request + 'COMMAND_MARKER',
              '',
              'OUTPUT_START',
              result.slice(0, 12000),
              'OUTPUT_END'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
