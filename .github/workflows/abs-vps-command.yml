name: ABS VPS Command Channel

on:
  issue_comment:
    types: [created]
  push:
    paths:
      - '.github/workflows/abs-vps-command.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-vps-command
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      (github.event_name == 'push') ||
      (github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'samuelferreira24' &&
       startsWith(github.event.comment.body, '/abs '))
    runs-on: [self-hosted, abs-vps-01]
    timeout-minutes: 10

    steps:
      - name: Execute allowlisted command
        id: command
        shell: bash
        env:
          REQUEST: ${{ github.event_name == 'push' && '/abs openclaw-status' || github.event.comment.body }}
        run: |
          set -u
          command="${REQUEST#'/abs '}"
          result=""

          case "$command" in
            install)
              set -e
              if [ ! -d "$HOME/Projeto-Absoluto/.git" ]; then
                git clone https://github.com/samuelferreira24/Projeto-Absoluto.git "$HOME/Projeto-Absoluto"
              else
                git -C "$HOME/Projeto-Absoluto" fetch origin main
                git -C "$HOME/Projeto-Absoluto" reset --hard origin/main
              fi
              sudo tee /etc/systemd/system/abs.service >/dev/null <<'UNIT'
          [Unit]
          Description=ABS Sistema Absoluto
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=absadmin
          WorkingDirectory=/home/absadmin/Projeto-Absoluto
          ExecStart=/usr/bin/python3 -m abs_core.server
          Restart=always
          RestartSec=5
          Environment=PYTHONUNBUFFERED=1

          [Install]
          WantedBy=multi-user.target
          UNIT
              sudo systemctl daemon-reload
              sudo systemctl enable abs.service
              sudo systemctl restart abs.service
              sleep 2
              result="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              ;;
            start)
              sudo systemctl enable abs.service
              sudo systemctl restart abs.service
              sleep 2
              result="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              ;;
            test)
              set -e
              work_json="$(curl -fsS --max-time 10 -X POST http://127.0.0.1:8787/works -H 'Content-Type: application/json' -d '{"objective":"ABS VPS end-to-end test"}')"
              work_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$work_json")"
              run_json="$(curl -fsS --max-time 10 -X POST "http://127.0.0.1:8787/works/$work_id/run" -H 'Content-Type: application/json' -d '{"capability_id":"echo","approved":false}')"
              health="$(curl -fsS --max-time 10 http://127.0.0.1:8787/health)"
              result="$(printf 'health: %s\nwork_create: %s\nwork_run: %s\n' "$health" "$work_json" "$run_json")"
              ;;
            openclaw-install)
              set -e
              export HOME=/home/absadmin
              export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.npm/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
              if ! command -v node >/dev/null 2>&1 || ! node -e 'process.exit(Number(process.versions.node.split(".")[0]) < 22 ? 1 : 0)'; then
                curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
                sudo apt-get install -y nodejs
              fi
              if ! command -v openclaw >/dev/null 2>&1; then
                sudo npm install -g openclaw@2026.9.8
              fi
              OPENCLAW_BIN="$(command -v openclaw)"
              "$OPENCLAW_BIN" --version > /tmp/openclaw-version.txt
              sudo tee /etc/systemd/system/openclaw-gateway.service >/dev/null <<UNIT
          [Unit]
          Description=OpenClaw Gateway - Projeto Absoluto
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=absadmin
          Group=absadmin
          WorkingDirectory=/home/absadmin
          Environment=HOME=/home/absadmin
          Environment=PATH=/home/absadmin/.local/bin:/home/absadmin/.npm-global/bin:/home/absadmin/.npm/bin:/usr/local/bin:/usr/bin:/bin
          ExecStart=$OPENCLAW_BIN gateway --port 18789
          Restart=always
          RestartSec=5
          TimeoutStopSec=30
          KillMode=control-group

          [Install]
          WantedBy=multi-user.target
          UNIT
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw setup --baseline --workspace /home/absadmin/.openclaw/workspace
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw config set gateway.mode local
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw doctor --generate-gateway-token
              sudo systemctl daemon-reload
              sudo systemctl enable openclaw-gateway.service
              sudo systemctl restart openclaw-gateway.service
              sleep 3
              {
                echo "version: $(cat /tmp/openclaw-version.txt)"
                echo "binary: $OPENCLAW_BIN"
                echo
                sudo systemctl is-active openclaw-gateway.service
                echo
                curl -fsS --max-time 10 http://127.0.0.1:18789/ >/dev/null && echo "gateway_http: reachable" || echo "gateway_http: not-ready"
              } > /tmp/openclaw-vps-result.txt
              result="$(cat /tmp/openclaw-vps-result.txt)"
              ;;
            openclaw-bootstrap)
              set -e
              export HOME=/home/absadmin
              export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
              mkdir -p /home/absadmin/openclaw-workspace/memory
              cat > /home/absadmin/openclaw-workspace/AGENTS.md <<'EOF'
# Projeto Absoluto — Ordem Operacional Provisória

## Papel
Você é o operador 24/7 do Projeto Absoluto na VPS. Observe, diagnostique, execute operações autorizadas e mantenha o sistema funcionando.

## Autoridade
- Imperador (usuário) = autoridade final.
- ABS = núcleo de autoridade/orquestração/verificação do sistema.
- OpenClaw = operador/inteligência operacional provisória; não substitui o ABS.
- ChatGPT e outras IAs = inteligências externas que podem orientar ou colaborar.

## Regras
1. Prefira observar e verificar antes de alterar.
2. Para operações do ABS, preserve o ciclo objetivo → execução → verificação → proveniência.
3. Registre mudanças relevantes na memória operacional.
4. Não apague dados, destrua serviços, altere firewall, credenciais ou arquitetura estrutural sem autorização explícita.
5. Mudanças reversíveis e manutenção rotineira podem ser executadas quando claramente necessárias.
6. Em caso de incerteza relevante, pare e peça orientação.
7. Nunca trate uma conversa ou inferência como evidência; prefira estado real, logs, testes e Git.
EOF
              cat > /home/absadmin/openclaw-workspace/MEMORY.md <<'EOF'
# Memória Operacional — Projeto Absoluto

## Estado em 2026-10-08
- VPS: abs-vps-01, Ubuntu 24.04, x86_64, 3 vCPU, ~5.7 GiB RAM, 2 GiB swap, ~46 GiB livres.
- Usuário operacional: absadmin.
- ABS: serviço systemd ativo em 127.0.0.1:8787; ciclo V1 objetivo → work → capability → execução → verificação → proveniência → persistência → resultado já foi testado com PASS.
- Coolify: instalado na VPS.
- Ponte ChatGPT → GitHub Actions → self-hosted runner → VPS: funcional.
- Runner: abs-vps-01, serviço persistente.
- OpenClaw: 2026.9.8 instalado em /usr/bin/openclaw.
- OpenClaw Gateway: serviço systemd openclaw-gateway.service, loopback 127.0.0.1:18789, persistente.

## Arquitetura provisória
Imperador → ABS (autoridade/orquestração/verificação) → OpenClaw (operador 24/7) → VPS/GitHub/Termux/browser e futuras integrações.
ChatGPT é uma inteligência externa, não o único operador.

## Próximo bloqueio
Conectar uma identidade de modelo ao OpenClaw. Preferência inicial: OpenAI Codex/ChatGPT OAuth por device code, se a conta for elegível. A autorização deve ser feita pelo usuário; não registrar códigos ou credenciais no GitHub.

## Memória
GitHub permanece a memória técnica versionada. Este workspace é memória operacional do operador. Mudanças importantes devem ser consolidadas no Git quando apropriado.
EOF
              cat > /home/absadmin/openclaw-workspace/memory/2026-10-08.md <<'EOF'
# 2026-10-08

OpenClaw foi instalado na VPS como operador 24/7 provisório. Gateway ativo por systemd, loopback 127.0.0.1:18789. Ainda sem perfil de autenticação de modelo. ABS continua sendo autoridade/orquestrador; OpenClaw não deve substituir essa função.
EOF
              chown -R absadmin:absadmin /home/absadmin/openclaw-workspace
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw config set agents.defaults.workspace /home/absadmin/openclaw-workspace
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw config set tools.exec.mode auto
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw config set agents.defaults.heartbeat.every 30m
              sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw config set agents.defaults.heartbeat.target none
              sudo systemctl restart openclaw-gateway.service
              sleep 5
              result="$(sudo -u absadmin env HOME=/home/absadmin /usr/bin/openclaw gateway status --deep 2>&1)"
              ;;
            openclaw-status)
              export HOME=/home/absadmin
              export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.npm/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
              {
                echo "[version]"
                command -v openclaw || true
                openclaw --version 2>&1 || true
                echo
                echo "[service]"
                sudo systemctl status openclaw-gateway.service --no-pager -l || true
                echo
                echo "[gateway]"
                openclaw gateway status --deep 2>&1 || true
                echo
                echo "[models-auth]"
                openclaw models auth list --provider openai --json 2>&1 || true
              } > /tmp/openclaw-vps-result.txt
              result="$(cat /tmp/openclaw-vps-result.txt)"
              ;;
            abs-status)
              {
                sudo systemctl status abs.service --no-pager -l || true
                echo
                echo "[health]"
                curl -fsS --max-time 10 http://127.0.0.1:8787/health || true
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            help)
              result='Available commands:
          /abs help
          /abs status
          /abs docker
          /abs coolify
          /abs git
          /abs install
          /abs start
          /abs abs-status
          /abs test
          /abs openclaw-install
          /abs openclaw-status
          /abs openclaw-bootstrap'
              ;;
            status)
              {
                echo "hostname: $(hostname)"
                echo "user: $(id -un)"
                echo "kernel: $(uname -a)"
                echo "uptime: $(uptime -p 2>/dev/null || true)"
                echo
                echo "[disk]"
                df -h /
                echo
                echo "[memory]"
                free -h
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            docker)
              if command -v docker >/dev/null 2>&1; then
                {
                  echo "docker: $(docker --version 2>&1)"
                  echo
                  docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1
                } > /tmp/abs-vps-result.txt
              else
                echo "docker: not installed or not in PATH" > /tmp/abs-vps-result.txt
              fi
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            coolify)
              {
                echo "[local port 8000]"
                curl -I -sS --max-time 10 http://127.0.0.1:8000 2>&1 | head -n 20 || true
                echo
                echo "[coolify containers]"
                if command -v docker >/dev/null 2>&1; then
                  docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' 2>&1 | grep -i coolify || true
                fi
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            git)
              {
                echo "git: $(git --version 2>&1)"
                if [ -d "$HOME/Projeto-Absoluto/.git" ]; then
                  echo
                  git -C "$HOME/Projeto-Absoluto" status --short --branch 2>&1
                else
                  echo
                  echo "Projeto-Absoluto: not found at $HOME/Projeto-Absoluto"
                fi
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            *)
              result="Comando não permitido: $command. Use /abs help."
              ;;
          esac

          {
            echo 'result<<ABS_RESULT_EOF'
            printf '%s\n' "$result"
            echo 'ABS_RESULT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report result
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.command.outputs.result }}
          REQUEST: ${{ github.event_name == 'push' && '/abs openclaw-status' || github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const issue_number = context.issue.number || 121;
            const result = process.env.RESULT || '(sem saída)';
            const request = process.env.REQUEST || '';
            const commentId = process.env.COMMENT_ID || '';
            const body = [
              '### ABS VPS',
              '',
              'COMMAND_MARKER' + request + 'COMMAND_MARKER',
              '',
              'OUTPUT_START',
              result.slice(0, 12000),
              'OUTPUT_END'
            ].join('\n');

            if (github.context.eventName === 'issue_comment') {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
            }