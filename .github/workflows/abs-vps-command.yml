                        if [[ "$table_count" =~ ^[0-9]+$ && "$migration_count" =~ ^[0-9]+$ ]] && [ "$table_count" -gt 20 ] && [ "$migration_count" -gt 0 ]; then
                          echo "RESTORE_TEST_PASS | tables=$table_count | migrations=$migration_count | artifact_bytes=$(stat -c %s "$artifact")"
                        else
                          echo "RESTORE_TEST_FAIL: restored schema validation failed; metadata=$metrics"
                        fi
                      else
                        echo "RESTORE_TEST_FAIL: pg_restore returned an error"
                      fi
                      if sudo -n docker exec coolify-db sh -lc 'dropdb --if-exists -U "$POSTGRES_USER" abs_coolify_restore_test' 2>&1; then
                        echo "temporary_database_cleanup=PASS"
                      else
                        echo "WARNING: temporary restore database cleanup failed; inspect Coolify DB before proceeding"
                      fi
                    else
                      echo "RESTORE_TEST_FAIL: could not create disposable database"
                    fi
                  fi
                fi
              } > /tmp/abs-vps-result.txt 2>&1
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            coolify-backup-verify)
              {
                echo "[Latest Coolify instance backup execution — non-secret metadata]"
                sudo -n docker exec coolify php artisan tinker --execute='$e = App\Models\ScheduledDatabaseBackupExecution::orderByDesc("id")->first(); echo json_encode(["execution_exists"=>(bool)$e,"status"=>$e ? $e->status : null,"size_bytes"=>$e ? $e->size : null,"database_name"=>$e ? $e->database_name : null,"finished_at"=>$e ? $e->finished_at : null,"local_storage_deleted"=>$e ? (bool)$e->local_storage_deleted : null,"s3_uploaded"=>$e ? $e->s3_uploaded : null,"filename_basename"=>$e ? basename($e->filename) : null], JSON_PRETTY_PRINT), PHP_EOL;' 2>&1 || true
                echo
                echo "[Backup artifact — path, size and file type]"
                sudo -n docker exec coolify sh -lc 'find /var/www/html/storage/app/backups -type f -printf "%p|%s bytes\n" 2>/dev/null | head -n 10 | while IFS="|" read -r p s; do echo "$p|$s"; file "$p" 2>/dev/null; done' 2>&1 || true
                echo
                echo "[Host-side backup artifact and PostgreSQL archive validation]"
                artifact="$(sudo -n find /data/coolify/backups -type f -name '*.dmp' -print -quit 2>/dev/null)"
                if [ -n "$artifact" ]; then
                  echo "artifact=$(basename "$artifact")"
                  stat -c 'bytes=%s modified=%y' "$artifact" 2>&1 || true
                  file "$artifact" 2>&1 || true
                  if sudo -n docker exec -i coolify-db pg_restore --list < "$artifact" > /tmp/abs-coolify-pg-restore-list.txt 2>&1; then
                    echo "pg_restore_archive_validation=PASS"
                    head -n 22 /tmp/abs-coolify-pg-restore-list.txt
                  else
                    echo "pg_restore_archive_validation=FAIL"
                    head -n 25 /tmp/abs-coolify-pg-restore-list.txt
                  fi
                else
                  echo "backup_artifact_not_found_on_host"
                fi
                echo
                echo "[Recovery key presence and filesystem permissions — key value never shown]"
                if sudo -n grep -q '^APP_KEY=base64:' /data/coolify/source/.env; then echo "APP_KEY_present=true"; else echo "APP_KEY_present=false"; fi
                sudo -n stat -c 'env_file_mode=%a owner=%U:%G' /data/coolify/source/.env 2>&1 || true
                sudo -n stat -c 'backup_dir_mode=%a owner=%U:%G' /data/coolify/backups 2>&1 || true
                if [ -n "$artifact" ]; then sudo -n stat -c 'backup_file_mode=%a owner=%U:%G' "$artifact" 2>&1 || true; fi
                echo
                echo "[Coolify runtime user and source-directory permissions]"
                sudo -n docker exec coolify sh -lc 'id; ps -eo user,uid,gid,comm | grep -E "php|artisan|supervisord" | head -n 12' 2>&1 || true
                sudo -n stat -c 'source_dir_mode=%a owner=%U:%G' /data/coolify/source 2>&1 || true
                echo
                echo "[Temporary restore database cleanup check]"
                temp_db="$(sudo -n docker exec coolify-db sh -lc 'psql -At -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres -c "SELECT 1 FROM pg_database WHERE datname = \$\$abs_coolify_restore_test\$\$;"' 2>&1)"
                if [ "$temp_db" = "1" ]; then echo "temporary_restore_database_remaining=true"; else echo "temporary_restore_database_remaining=false"; fi
                echo
                echo "[Current backup schedule — safe fields only]"
                sudo -n docker exec coolify php artisan tinker --execute='$b = App\Models\ScheduledDatabaseBackup::where("database_id",0)->where("team_id",0)->first(); echo json_encode(["schedule_exists"=>(bool)$b,"enabled"=>$b ? (bool)$b->enabled : null,"frequency"=>$b ? $b->frequency : null,"retention_count"=>$b ? $b->database_backup_retention_amount_locally : null,"retention_days"=>$b ? $b->database_backup_retention_days_locally : null,"retention_max_gb"=>$b ? $b->database_backup_retention_max_storage_locally : null,"local_enabled"=>$b ? !(bool)$b->disable_local_backup : null,"s3_enabled"=>$b ? (bool)$b->save_s3 : null], JSON_PRETTY_PRINT), PHP_EOL;' 2>&1 || true
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            coolify-backup-preflight)
              {
                echo "[Native Coolify instance-backup preflight — non-secret fields only]"
                sudo -n docker exec coolify php artisan tinker --execute='$server = App\Models\Server::find(0); $db = App\Models\StandalonePostgresql::find(0); echo json_encode(["server_record_exists"=>(bool)$server,"server_functional"=>$server ? (bool)$server->isFunctional() : false,"instance_db_record_exists"=>(bool)$db,"instance_db_status"=>$db ? $db->status : "not-registered","instance_db_scheduled_backups"=>$db ? $db->scheduledBackups()->count() : 0,"instance_db_backup_executions"=>$db ? $db->scheduledBackups()->withCount("executions")->get()->sum("executions_count") : 0], JSON_PRETTY_PRINT), PHP_EOL;' 2>&1 || true
                echo
                echo "[Coolify DB container readiness]"
                sudo -n docker inspect coolify-db --format 'state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}}' 2>&1 || true
                echo
                echo "[backup path free space]"
                df -h /data/coolify/backups /data/coolify/source 2>&1 || true
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            coolify-configure-basics)
              {
                echo "[Applying requested Coolify-only preferences]"
                sudo -n docker exec coolify php artisan tinker --execute='$s = App\Models\InstanceSettings::find(0); $s->update(["instance_name"=>"ABS VPS 01","instance_timezone"=>"America/Sao_Paulo","is_sponsorship_popup_enabled"=>false]); echo json_encode(["instance_name"=>$s->fresh()->instance_name,"instance_timezone"=>$s->fresh()->instance_timezone,"sponsorship_popup_enabled"=>$s->fresh()->is_sponsorship_popup_enabled], JSON_PRETTY_PRINT), PHP_EOL;' 2>&1
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            git)
              {
                echo "git: $(git --version 2>&1)"
                if [ -d "$HOME/Projeto-Absoluto/.git" ]; then
                  echo
                  git -C "$HOME/Projeto-Absoluto" status --short --branch 2>&1
                else
                  echo
                  echo "Projeto-Absoluto: not found at $HOME/Projeto-Absoluto"
                fi
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            coolify-dashboard-verify)
              {
                echo "[Coolify HTTPS dashboard route — certificate validation enabled]"
                curl -sS --max-time 15 -o /dev/null -w 'https_status=%{http_code} remote_ip=%{remote_ip} ssl_verify_result=%{ssl_verify_result}\\n' 'https://coolify.207.180.3.245.sslip.io' 2>&1 || true
                echo
                echo "[HTTP redirect behavior]"
                curl -sS --max-time 15 -D - -o /dev/null 'http://coolify.207.180.3.245.sslip.io' 2>&1 | grep -Ei '^(HTTP/|Location:)' | head -n 5 || true
                echo
                echo "[Dashboard direct port fallback]"
                curl -sS --max-time 10 -o /dev/null -w 'port_8000_http_status=%{http_code}\\n' 'http://127.0.0.1:8000' 2>&1 || true
                echo
                echo "[Coolify stack health]"
                sudo -n docker ps --format '{{.Names}}|{{.Status}}' | grep -E '^coolify($|-)' || true
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            coolify-locale-runtime)
              {
                echo "[All locale-switching code references]"
                sudo -n docker exec coolify sh -lc 'grep -RniE "setLocale|setlocale|app.locale|APP_LOCALE|pt-br.json|Accept-Language|locale" /var/www/html/app /var/www/html/bootstrap /var/www/html/routes /var/www/html/config /var/www/html/resources/js 2>/dev/null | head -n 160' 2>&1 || true
                echo
                echo "[Official Portuguese translation file metadata and representative keys]"
                sudo -n docker exec coolify php -r '$f="/var/www/html/lang/pt-br.json"; $d=json_decode(file_get_contents($f),true) ?: []; echo "file_bytes=".filesize($f)." keys=".count($d).PHP_EOL; foreach (["Dashboard","Projects","Servers","Settings","Logout","Applications","Services","Deploy","Save","Cancel"] as $k) echo $k." => ".($d[$k] ?? "(not in translation file)").PHP_EOL;'
                echo
                echo "[Current runtime config cache]"
                sudo -n docker exec coolify sh -lc 'ls -l /var/www/html/bootstrap/cache/config.php 2>/dev/null || true; grep -n "locale" /var/www/html/config/app.php | head -n 8'
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            coolify-locale-deep-inspect)
              {
                echo "[Laravel locale files and env override support]"
                sudo -n docker exec coolify sh -lc 'grep -RniE "APP_LOCALE|config\([\x27\x22]app.locale|app.locale|pt-br.json|locale.*localStorage|setLocale|language" /var/www/html/config /var/www/html/resources/js /var/www/html/resources/views /var/www/html/app/Livewire 2>/dev/null | head -n 120' 2>&1 || true
                echo
                echo "[Existing translation keys versus source strings]"
                sudo -n docker exec coolify php -r '$f="/var/www/html/lang/pt-br.json"; $d=json_decode(file_get_contents($f),true) ?: []; echo "keys=".count($d).PHP_EOL; echo "app_config_locale=".(require "/var/www/html/config/app.php")["locale"].PHP_EOL; foreach (["Dashboard","Projects","Servers","Settings","Logout","Applications","Services","Terminal","Deploy","Backups"] as $k) echo $k." => ".($d[$k] ?? "(missing)").PHP_EOL;' 2>&1 || true
                echo
                echo "[Dashboard HTTPS redirect location]"
                curl -sS -k -I --max-time 10 'https://coolify.207.180.3.245.sslip.io/' 2>&1 | grep -Ei '^(HTTP/|location:|content-type:)' | head -n 12
                echo
                echo "[Code Server HTTPS redirect location]"
                curl -sS -k -I --max-time 10 'https://codeserver-bb55qbolrf4pqfl45gomnzyl.207.180.3.245.sslip.io/' 2>&1 | grep -Ei '^(HTTP/|location:|content-type:)' | head -n 12
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            coolify-code-server-verify)
              {
                echo "[Code Server container health and runtime settings — secrets omitted]"
                sudo -n docker inspect code-server-bb55qbolrf4pqfl45gomnzyl --format 'state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} started={{.State.StartedAt}} image={{.Config.Image}}' 2>&1 || true
                sudo -n docker inspect code-server-bb55qbolrf4pqfl45gomnzyl --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -E '^(TZ|PUID|PGID|DEFAULT_WORKSPACE)=' || true
                echo
                echo "[Public HTTP route probe]"
                curl -sS --max-time 12 -o /dev/null -w 'http_status=%{http_code} remote_ip=%{remote_ip} content_type=%{content_type}\\n' 'http://codeserver-bb55qbolrf4pqfl45gomnzyl.207.180.3.245.sslip.io' 2>&1 || true
                echo
                echo "[Public HTTPS route probe]"
                curl -sS --max-time 12 -o /dev/null -w 'https_status=%{http_code} remote_ip=%{remote_ip} content_type=%{content_type}\\n' 'https://codeserver-bb55qbolrf4pqfl45gomnzyl.207.180.3.245.sslip.io' 2>&1 || true
                echo
                echo "[Code Server application row — safe fields only]"
                sudo -n docker exec coolify php artisan tinker --execute='$r=app("db")->table("service_applications")->where("service_id",5)->first(); if ($r) echo json_encode(["uuid"=>$r->uuid,"fqdn"=>$r->fqdn,"image"=>$r->image,"is_force_https_enabled"=>$r->is_force_https_enabled],JSON_PRETTY_PRINT),PHP_EOL;' 2>&1 || true
                echo
                echo "[Recent Code Server container logs — last 35 lines, secrets redacted]"
                sudo -n docker logs --tail 35 code-server-bb55qbolrf4pqfl45gomnzyl 2>&1 | sed -E 's/(PASSWORD|TOKEN|SECRET|KEY)=([^ ]+)/\\1=[REDACTED]/Ig' | tail -n 35 || true
              } > /tmp/abs-vps-result.txt
              result="$(cat /tmp/abs-vps-result.txt)"
              ;;
            *)
              result="Comando não permitido: $command. Use /abs help."
              ;;
          esac

          echo "command=$command" >> "$GITHUB_OUTPUT"
          {
            echo 'result<<ABS_RESULT_EOF'
            printf '%s\n' "$result"
            echo 'ABS_RESULT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report result
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.command.outputs.result }}
          REQUEST: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const issue_number = context.issue.number || 121;
            const result = process.env.RESULT || '(sem saída)';
            const request = process.env.REQUEST || '';
            const commentId = process.env.COMMENT_ID || '';
            const body = [
              '### ABS VPS',
              '',
              'COMMAND_MARKER' + request + 'COMMAND_MARKER',
              '',
              'OUTPUT_START',
              result.slice(0, 12000),
              'OUTPUT_END'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
