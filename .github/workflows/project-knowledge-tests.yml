name: Project Knowledge Tests

on:
  push:
    branches: ["main", "codex/project-knowledge-continuity-v1"]
  pull_request:
    branches: ["main"]

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - name: Test Project Knowledge vertical
        run: pytest -q tests/test_project_knowledge.py tests/test_path_evaluator.py tests/test_project_knowledge_runtime.py
