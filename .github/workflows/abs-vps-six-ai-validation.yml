name: ABS VPS Six AI Validation

on:
  push:
    branches:
      - ops/vps-six-ai-validation
    paths:
      - ".github/operations/vps-command.txt"

permissions:
  contents: read
  issues: write

concurrency:
  group: abs-vps-shared-tree
  cancel-in-progress: false

jobs:
  validate-one:
    runs-on: [self-hosted, abs-vps-01]
    timeout-minutes: 25
    steps:
      - name: Checkout isolated workspace
        uses: actions/checkout@v4

      - name: Run one allowlisted validation
        id: test
        shell: bash
        run: |
          set -u
          command="$(tr -d '\r\n' < .github/operations/vps-command.txt)"
          result_file="$(mktemp)"
          run_model_test() {
            local capability="$1" model="$2" expected="$3" min_kb="$4" min_ollama_bytes="$5" request_timeout="$6" max_time="$7" max_tokens="$8"
            local available_kb ollama_max response curl_rc
            available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
            ollama_max="$(systemctl show ollama.service -p MemoryMax --value 2>/dev/null || echo 0)"
            case "$ollama_max" in
              ""|infinity|max) ollama_max=9223372036854775807 ;;
            esac
            {
              echo "[model] $model"
              echo "[capability] $capability"
              echo "[MemAvailable_kB] $available_kb"
              echo "[Ollama MemoryMax bytes] $ollama_max"
              if [ "$available_kb" -lt "$min_kb" ]; then
                echo "BLOCKED_SAFE: insufficient available RAM; model was not loaded."
                free -h
                return 0
              fi
              if [ "$ollama_max" -lt "$min_ollama_bytes" ]; then
                echo "BLOCKED_SAFE: Ollama MemoryMax is below the model's approximate on-disk size; not loading to avoid OOM."
                free -h
                return 0
              fi
              echo "[ABS /chat request]"
              if response="$(curl -sS --max-time "$max_time" -X POST http://127.0.0.1:8787/chat -H 'Content-Type: application/json' -d "{\"message\":\"Reply exactly $expected and nothing else.\",\"approved\":true,\"context\":{\"capability_id\":\"$capability\",\"max_tokens\":$max_tokens,\"temperature\":0,\"think\":false,\"keep_alive\":0,\"timeout\":$request_timeout}}" 2>&1)"; then
                curl_rc=0
              else
                curl_rc=$?
              fi
              echo "[curl_rc] $curl_rc"
              printf '%s\n' "$response" | head -c 5000
              echo
              if [ "$curl_rc" -ne 0 ]; then
                echo "FAIL: HTTP request failed."
                free -h
                return 0
              fi
              if printf '%s\\n' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); expected=sys.argv[1].upper(); cap=sys.argv[2]; model=sys.argv[3]; assert d.get("work_state")=="completed", d; assert expected in str(d.get("response","")).upper(), d; assert d.get("resource",{}).get("metadata",{}).get("model")==model, d.get("resource"); p=d.get("provenance") or []; p=p if isinstance(p,list) else [p]; assert any(isinstance(x,dict) and x.get("capability_id")==cap for x in p), p; print("ABS MODEL VIA V3 PASS; capability="+cap+"; model="+model)' "$expected" "$capability" "$model"; then
                echo "VALIDATION=PASS"
              else
                echo "VALIDATION=FAIL"
              fi
              echo "[active Ollama models after keep_alive=0]"
              curl -fsS --max-time 5 http://127.0.0.1:11434/api/ps || true
              echo
              free -h
            } > "$result_file" 2>&1
          }


          install_hf_model() {
            local model_tag="$1" min_free_kb="$2"
            {
              echo "[install tag] $model_tag"
              if ollama list | awk 'NR>1 {print $1}' | grep -Fxq "$model_tag"; then
                echo "Model tag already exists."
                echo "OPERATION=PASS"
                return 0
              fi
              local available_kb free_kb active
              available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
              free_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
              echo "[MemAvailable_kB] $available_kb"
              echo "[disk_free_kB] $free_kb"
              if [ "$available_kb" -lt 4194304 ] || [ "$free_kb" -lt "$min_free_kb" ]; then
                echo "BLOCKED_SAFE: memory or disk preflight failed; no pull started."
                return 1
              fi
              active="$(curl -fsS --max-time 5 http://127.0.0.1:11434/api/ps)" || { echo "FAIL: Ollama API unavailable."; return 1; }
              if ! printf '%s' "$active" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert not d.get("models"), d; print("No active Ollama models.")'; then
                echo "BLOCKED_SAFE: an Ollama model is still active."
                return 1
              fi
              if ! ollama pull "$model_tag"; then
                echo "FAIL: Ollama pull failed."
                return 1
              fi
              if ! ollama list | awk 'NR>1 {print $1}' | grep -Fxq "$model_tag"; then
                echo "FAIL: pulled tag is not present in Ollama list."
                return 1
              fi
              ollama list
              echo "OPERATION=PASS"
            } > "$result_file" 2>&1
          }

          switch_model() {
            local capability="$1" from_entry="$2" to_entry="$3" target_tag="$4"
            {
              echo "[switch capability] $capability"
              echo "[target tag] $target_tag"
              if ! ollama list | awk 'NR>1 {print $1}' | grep -Fxq "$target_tag"; then
                echo "FAIL: target model tag is not installed."
                return 1
              fi
              local active
              active="$(curl -fsS --max-time 5 http://127.0.0.1:11434/api/ps)" || { echo "FAIL: Ollama API unavailable."; return 1; }
              if ! printf '%s' "$active" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert not d.get("models"), d; print("No active Ollama models.")'; then
                echo "BLOCKED_SAFE: unload the active model before changing routing."
                return 1
              fi
              if ! sudo python3 - "$from_entry" "$to_entry" <<'PYMAP'
          from pathlib import Path
          import sys
          p = Path("/etc/abs-local-models.env")
          s = p.read_text()
          old, new = sys.argv[1], sys.argv[2]
          if new in s:
              print("Mapping already set.")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("Mapping updated.")
          else:
              raise SystemExit("Expected model mapping not found; refusing to alter config.")
          PYMAP
              then
                echo "FAIL: could not update model map."
                return 1
              fi
              if ! sudo systemctl restart abs.service; then
                echo "FAIL: ABS restart failed."
                return 1
              fi
              sleep 4
              if ! curl -fsS --max-time 10 http://127.0.0.1:8787/health; then
                echo "FAIL: ABS health check failed after routing change."
                return 1
              fi
              echo
              if ! curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status | python3 -c 'import json,sys; d=json.load(sys.stdin); cap,tag=sys.argv[1:3]; r=next(x for x in d["intelligence"] if x.get("id")==cap); assert r.get("metadata",{}).get("model")==tag, r; print("ROUTING PASS: "+cap+" -> "+tag)' "$capability" "$target_tag"; then
                echo "FAIL: ABS registry does not show the target model."
                return 1
              fi
              echo "OPERATION=PASS"
            } > "$result_file" 2>&1
          }

          case "$command" in

            install-qwen4b-q3)
              if install_hf_model "hf.co/bartowski/Qwen_Qwen3.5-4B-GGUF:Q3_K_S" 6291456; then :; else echo "OPERATION=FAIL" >> "$result_file"; fi
              ;;
            install-gemma-e2b-q3)
              if install_hf_model "hf.co/dahus/gemma-4-e2b-it-Q3_K_S-GGUF:Q3_K_S" 8388608; then :; else echo "OPERATION=FAIL" >> "$result_file"; fi
              ;;
            install-gemma-e4b-q2)
              if install_hf_model "hf.co/mradermacher/gemma-4-E4B-it-i1-GGUF:Q2_K" 10485760; then :; else echo "OPERATION=FAIL" >> "$result_file"; fi
              ;;
            switch-qwen4b-q3)
              if switch_model "local-ai:qwen3.5-4b" "qwen3.5-4b|http://127.0.0.1:11434|qwen3.5:4b" "qwen3.5-4b|http://127.0.0.1:11434|hf.co/bartowski/Qwen_Qwen3.5-4B-GGUF:Q3_K_S" "hf.co/bartowski/Qwen_Qwen3.5-4B-GGUF:Q3_K_S"; then :; else echo "OPERATION=FAIL" >> "$result_file"; fi
              ;;
            rollback-qwen4b)
              if switch_model "local-ai:qwen3.5-4b" "qwen3.5-4b|http://127.0.0.1:11434|qwen3.5:4b-q3" "qwen3.5-4b|http://127.0.0.1:11434|qwen3.5:4b" "qwen3.5:4b"; then :; else echo "OPERATION=FAIL" >> "$result_file"; fi
              ;;
            switch-gemma-e2b-q3)
              if switch_model "local-ai:gemma4-e2b" "gemma4-e2b|http://127.0.0.1:11434|gemma4:e2b" "gemma4-e2b|http://127.0.0.1:11434|hf.co/dahus/gemma-4-e2b-it-Q3_K_S-GGUF:Q3_K_S" "hf.co/dahus/gemma-4-e2b-it-Q3_K_S-GGUF:Q3_K_S"; then :; else echo "OPERATION=FAIL" >> "$result_file"; fi
              ;;
            rollback-gemma-e2b)
              if switch_model "local-ai:gemma4-e2b" "gemma4-e2b|http://127.0.0.1:11434|gemma4:e2b-q3" "gemma4-e2b|http://127.0.0.1:11434|gemma4:e2b" "gemma4:e2b"; then :; else echo "OPERATION=FAIL" >> "$result_file"; fi
              ;;
            switch-gemma-e4b-q2)
              if switch_model "local-ai:gemma4-e4b" "gemma4-e4b|http://127.0.0.1:11434|gemma4:e4b" "gemma4-e4b|http://127.0.0.1:11434|hf.co/mradermacher/gemma-4-E4B-it-i1-GGUF:Q2_K" "hf.co/mradermacher/gemma-4-E4B-it-i1-GGUF:Q2_K"; then :; else echo "OPERATION=FAIL" >> "$result_file"; fi
              ;;
            rollback-gemma-e4b)
              if switch_model "local-ai:gemma4-e4b" "gemma4-e4b|http://127.0.0.1:11434|gemma4:e4b-i1-q2" "gemma4-e4b|http://127.0.0.1:11434|gemma4:e4b" "gemma4:e4b"; then :; else echo "OPERATION=FAIL" >> "$result_file"; fi
              ;;

            status)
              {
                echo "[host]"; hostname
                echo "[ABS health]"; curl -fsS --max-time 10 http://127.0.0.1:8787/health
                echo
                echo "[V3 status]"; curl -fsS --max-time 10 http://127.0.0.1:8787/v3/status
                echo
                echo "[Ollama service limits]"
                systemctl show ollama.service -p ActiveState -p SubState -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemorySwapMax
                echo "[Ollama installed models]"; ollama list
                echo "[Ollama active models]"; curl -fsS --max-time 5 http://127.0.0.1:11434/api/ps || true
                echo
                echo "[RAM]"; free -h
                echo "[disk]"; df -h /
              } > "$result_file" 2>&1
              ;;
            test-qwen-0.8b)
              run_model_test "local-ai:qwen3.5-0.8b" "qwen3.5:0.8b" "ABS_QWEN_08B_OK" 1572864 0 120 150 16
              ;;
            test-qwen-2b)
              run_model_test "local-ai:qwen3.5-2b" "qwen3.5:2b" "ABS_QWEN_2B_OK" 4194304 0 120 150 16
              ;;
            test-qwen-4b)
              run_model_test "local-ai:qwen3.5-4b" "hf.co/bartowski/Qwen_Qwen3.5-4B-GGUF:Q3_K_S" "Q4_OK" 4194304 0 240 270 8
              ;;
            test-ministral-3b)
              run_model_test "local-ai:ministral-3b" "ministral-3:3b" "M3_OK" 4194304 2900000000 180 210 8
              ;;
            test-gemma-e2b)
              run_model_test "local-ai:gemma4-e2b" "hf.co/dahus/gemma-4-e2b-it-Q3_K_S-GGUF:Q3_K_S" "GE2_OK" 4194304 0 240 270 8
              ;;
            test-gemma-e4b)
              run_model_test "local-ai:gemma4-e4b" "hf.co/mradermacher/gemma-4-E4B-it-i1-GGUF:Q2_K" "GE4_OK" 4404019 0 300 330 8
              ;;
            *)
              printf 'REJECTED: command not allowlisted: %s\n' "$command" > "$result_file"
              ;;
          esac
          {
            echo 'result<<ABS_RESULT_EOF'
            cat "$result_file"
            echo 'ABS_RESULT_EOF'
          } >> "$GITHUB_OUTPUT"
          if [[ "$command" == test-* ]] && ! grep -q 'VALIDATION=PASS' "$result_file"; then
            echo "Model validation did not pass: $command" >&2
            exit 1
          fi
          if [[ "$command" == install-* || "$command" == switch-* || "$command" == rollback-* ]] && ! grep -q 'OPERATION=PASS' "$result_file"; then
            echo "Model maintenance operation did not pass: $command" >&2
            exit 1
          fi
          if [[ "$command" == install-* || "$command" == switch-* || "$command" == rollback-* ]] && ! grep -q 'OPERATION=PASS' "$result_file"; then
            echo "Model maintenance operation did not pass: $command" >&2
            exit 1
          fi

      - name: Publish result to ABS VPS issue
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.test.outputs.result }}
          COMMAND: ${{ github.event.head_commit.message }}
        with:
          script: |
            const body = [
              '### ABS VPS — validação sequencial das seis IAs',
              '',
              'Comando: `' + (process.env.COMMAND || 'não informado') + '`',
              '',
              'OUTPUT_START',
              (process.env.RESULT || '(sem saída)').slice(0, 12000),
              'OUTPUT_END'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 121,
              body
            });
