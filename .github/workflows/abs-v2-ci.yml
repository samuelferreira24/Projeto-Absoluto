name: ABS V2 CI
on:
  push:
    branches: ["arquitetura/abs-v2-pre-construcao"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: pytest -q tests/test_abs_v2.py
      - run: python -m compileall -q abs_core
