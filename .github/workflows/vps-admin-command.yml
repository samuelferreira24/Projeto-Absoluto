name: VPS Direct Administration Channel

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  execute:
    if: >-
      github.event.issue.pull_request == null &&
      (github.event.issue.number == 121 || github.event.issue.number == 162) &&
      github.event.comment.user.login == 'samuelferreira24' &&
      startsWith(github.event.comment.body, '/vps ')
    concurrency:
      group: vps-admin-readonly
      cancel-in-progress: false
    runs-on: [self-hosted]
    timeout-minutes: 5

    steps:
      - name: Execute allowlisted VPS diagnostic
        id: command
        shell: bash
        env:
          REQUEST: ${{ github.event.comment.body }}
        run: |
          set -u
          command="${REQUEST#'/vps '}"
          result=""

          case "$command" in
            help)
              result='Available commands:
          /vps help
          /vps status
          /vps services
          /vps docker
          /vps coolify
          /vps proxy-info
          /vps mcp-verify
          /vps workspace'
              ;;
            status)
              {
                echo "[host]"
                hostname
                id
                echo
                echo "[uptime and load]"
                uptime
                echo
                echo "[memory]"
                free -h
                echo
                echo "[disk]"
                df -h /
                echo
                echo "[CPU]"
                nproc
              } > /tmp/vps-admin-result.txt 2>&1
              result="$(cat /tmp/vps-admin-result.txt)"
              ;;
            services)
              {
                echo "[SSH, network, Docker, Coolify, and control runners]"
                sudo -n systemctl show \
                  ssh.service tailscaled.service docker.service \
                  actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01.service \
                  actions.runner.samuelferreira24-Projeto-Absoluto.abs-vps-01-reserve.service \
                  -p Id -p ActiveState -p SubState -p Result 2>&1 || true
                echo
                echo "[related service units]"
                systemctl list-units --type=service --state=running --no-legend \
                  | grep -Ei 'coolify|code-server|tailscale|actions.runner|docker|ssh' \
                  | head -n 60 || true
              } > /tmp/vps-admin-result.txt 2>&1
              result="$(cat /tmp/vps-admin-result.txt)"
              ;;
            docker)
              {
                echo "[Docker version]"
                docker --version 2>&1 || true
                echo
                echo "[running containers; environment values omitted]"
                sudo -n docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1 || true
                echo
                echo "[Docker resource use]"
                sudo -n docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}' 2>&1 || true
              } > /tmp/vps-admin-result.txt 2>&1
              result="$(cat /tmp/vps-admin-result.txt)"
              ;;
            coolify)
              {
                echo "[Coolify container status]"
                sudo -n docker inspect coolify --format 'state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}} restarts={{.RestartCount}} image={{.Config.Image}}' 2>&1 || true
                echo
                echo "[Coolify HTTP endpoint; response body and cookies omitted]"
                curl -sS -o /dev/null -D - --max-time 8 http://127.0.0.1:8000 2>&1 \
                  | grep -Ei '^(HTTP/|content-type:|location:|server:)' | head -n 12 || true
                echo
                echo "[Coolify proxy]"
                sudo -n docker inspect coolify-proxy --format 'state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}} image={{.Config.Image}}' 2>&1 || true
              } > /tmp/vps-admin-result.txt 2>&1
              result="$(cat /tmp/vps-admin-result.txt)"
              ;;
            proxy-info)
              {
                echo "[Docker networks]"
                sudo -n docker network ls --format 'table {{.Name}}\\t{{.Driver}}' 2>&1 || true
                echo
                echo "[Proxy networks]"
                sudo -n docker inspect coolify-proxy --format '{{json .NetworkSettings.Networks}}' 2>&1 || true
                echo
                echo "[Proxy startup arguments]"
                sudo -n docker inspect coolify-proxy --format '{{json .Config.Cmd}}' 2>&1 || true
                echo
                echo "[Proxy compose routing configuration — selected directives only]"
                sudo -n grep -E 'entryPoints:|entrypoints:|certificatesResolvers:|certificatesresolvers:|acme:|providers:|docker:|tls:|--entrypoints|--certificatesresolvers|--providers' /data/coolify/proxy/docker-compose.yml 2>/dev/null | head -n 80 || true
                echo "[Proxy labels — no environment variables]"
                sudo -n docker inspect coolify-proxy --format '{{json .Config.Labels}}' 2>&1 || true
                echo
                echo "[Existing Code Server routing labels — no environment variables]"
                sudo -n docker inspect code-server-bb55qbolrf4pqfl45gomnzyl --format '{{json .Config.Labels}}' 2>&1 || true
                echo
                echo "[DNS resolution for candidate HTTPS hostname]"
                getent ahostsv4 mcp.207.180.3.245.sslip.io 2>&1 | head -n 5 || true
                echo
                echo "[Existing HTTPS route baseline]"
                curl -sS --max-time 10 -o /dev/null -w 'http_status=%{http_code} remote_ip=%{remote_ip} tls_verify=%{ssl_verify_result}\\n' https://coolify.207.180.3.245.sslip.io/ 2>&1 || true
              } > /tmp/vps-admin-result.txt 2>&1
              result="$(cat /tmp/vps-admin-result.txt)"
              ;;
            mcp-verify)
              {
                endpoint="https://mcp.207.180.3.245.sslip.io"
                token="$(sudo cat /opt/vps-mcp/api_token 2>/dev/null || true)"
                if [ -z "$token" ]; then
                  echo "MCP token not installed on host"
                else
                  echo "[health endpoint]"
                  curl -sS -o /dev/null -w 'health_http=%{http_code} tls_verify=%{ssl_verify_result}\n' --max-time 10 "$endpoint/healthz" 2>&1 || true
                  echo
                  echo "[unauthenticated request]"
                  code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$endpoint/mcp" 2>&1 || true)"
                  echo "unauthenticated_http=$code (expected 401)"
                  echo
                  echo "[authenticated initialize]"
                  curl -sS -D /tmp/vps-mcp-init-headers.txt -o /tmp/vps-mcp-init-body.txt -w 'initialize_http=%{http_code}\n' \
                    --max-time 12 -X POST "$endpoint/mcp" \
                    -H "Authorization: Bearer $token" \
                    -H 'Content-Type: application/json' \
                    -H 'Accept: application/json, text/event-stream' \
                    --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"vps-mcp-verify","version":"0.1.0"}}}' 2>&1 || true
                  session_id="$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/ {sub(/\r$/, "", $2); print $2}' /tmp/vps-mcp-init-headers.txt 2>/dev/null | tail -n 1)"
                  if [ -z "$session_id" ]; then
                    echo "session_id=missing"
                    sed -E 's/(token|secret|password|api[_-]?key)[^,}]*/\1=[REDACTED]/Ig' /tmp/vps-mcp-init-body.txt 2>/dev/null | head -c 1000 || true
                    echo
                  else
                    echo "session_id=received"
                    echo
                    echo "[authenticated tools/list]"
                    curl -sS -D /tmp/vps-mcp-tools-headers.txt -o /tmp/vps-mcp-tools-body.txt -w 'tools_list_http=%{http_code}\n' \
                      --max-time 12 -X POST "$endpoint/mcp" \
                      -H "Authorization: Bearer $token" \
                      -H "Mcp-Session-Id: $session_id" \
                      -H 'MCP-Protocol-Version: 2025-03-26' \
                      -H 'Content-Type: application/json' \
                      -H 'Accept: application/json, text/event-stream' \
                      --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' 2>&1 || true
                    tools_payload="$(sed -n 's/^data: //p' /tmp/vps-mcp-tools-body.txt | head -n 1)"
                    if [ -n "$tools_payload" ]; then
                      printf '%s' "$tools_payload" | python3 -c 'import sys,json; d=json.load(sys.stdin); t=d.get("result",{}).get("tools",[]); print("tool_count="+str(len(t))); print("tools="+", ".join(sorted(x.get("name","?") for x in t)))'
                    else
                      echo "tools_list_parse=FAIL"
                      head -c 1000 /tmp/vps-mcp-tools-body.txt || true
                      echo
                    fi                  fi
                  unset token
                  rm -f /tmp/vps-mcp-init-headers.txt /tmp/vps-mcp-init-body.txt /tmp/vps-mcp-tools-headers.txt /tmp/vps-mcp-tools-body.txt
                fi
              } > /tmp/vps-admin-result.txt 2>&1
              result="$(cat /tmp/vps-admin-result.txt)"
              ;;
            mcp-smoke)
              {
                set -u
                endpoint="https://mcp.207.180.3.245.sslip.io"
                token="$(sudo cat /opt/vps-mcp/api_token 2>/dev/null || true)"
                if [ -z "$token" ]; then
                  echo "MCP token missing; no tool calls made"
                else
                  curl -sS -D /tmp/vps-mcp-smoke-init-h.txt -o /tmp/vps-mcp-smoke-init-b.txt -w 'initialize_http=%{http_code}\n' --max-time 12 -X POST "$endpoint/mcp" \
                    -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                    --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"vps-direct-admin-smoke","version":"0.1.0"}}}' 2>&1 || true
                  sid="$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/ {sub(/\r$/, "", $2); print $2}' /tmp/vps-mcp-smoke-init-h.txt 2>/dev/null | tail -n 1)"
                  if [ -z "$sid" ]; then
                    echo "session_id=missing"
                    sed -E 's/(token|secret|password|api[_-]?key)[^,}]*/\1=[REDACTED]/Ig' /tmp/vps-mcp-smoke-init-b.txt | head -c 800
                    echo
                  else
                    echo "session_id=received"
                    for spec in 'vps_status|{}' 'list_containers|{"include_stopped":true}'; do
                      tool="${spec%%|*}"
                      args="${spec#*|}"
                      python3 -c 'import json,sys; print(json.dumps({"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":sys.argv[1],"arguments":json.loads(sys.argv[2])}},separators=(",",":")))' "$tool" "$args" > /tmp/vps-mcp-smoke-request.json
                      echo "[$tool]"
                      curl -sS -D /tmp/vps-mcp-smoke-call-h.txt -o /tmp/vps-mcp-smoke-call-b.txt -w 'tool_call_http=%{http_code}\n' --max-time 20 -X POST "$endpoint/mcp" \
                        -H "Authorization: Bearer $token" -H "Mcp-Session-Id: $sid" -H 'MCP-Protocol-Version: 2025-03-26' \
                        -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                        --data-binary @/tmp/vps-mcp-smoke-request.json 2>&1 || true
                      python3 - "$tool" /tmp/vps-mcp-smoke-call-b.txt <<'PY'
          import json,re,sys
          tool,path=sys.argv[1:]
          raw=open(path,encoding="utf-8",errors="replace").read()
          payload=next((line[6:] for line in raw.splitlines() if line.startswith("data: ")), "")
          if not payload:
              print("result_parse=FAIL; no_sse_data_line")
              raise SystemExit(0)
          try:
              data=json.loads(payload)
          except Exception:
              print("result_parse=FAIL; invalid_json_envelope")
              raise SystemExit(0)
          if data.get("error"):
              print("tool_execution=FAIL")
              print(json.dumps(data["error"])[:1200])
              raise SystemExit(0)
          res=data.get("result",{})
          if res.get("isError"):
              print("tool_execution=FAIL")
              print(json.dumps(res.get("content",[])[:1])[:1200])
              raise SystemExit(0)
          sc=res.get("structuredContent")
          parts=res.get("content",[])
          texts=[p.get("text","") for p in parts if isinstance(p,dict) and isinstance(p.get("text"),str)]
          parsed_text=None
          if not sc and texts:
              try: parsed_text=json.loads("\n".join(texts))
              except Exception: parsed_text=None
          if not sc and parsed_text is not None:
              sc=parsed_text
          def safe_preview(value, limit):
              value=value[:limit]
              value=re.sub(r"(?i)(bearer\s+)[A-Za-z0-9._~-]+",r"\1[REDACTED]",value)
              value=re.sub(r"(?i)(token|secret|password|api[_-]?key)(\s*[:=]\s*)[^\s,;]+",r"\1\2[REDACTED]",value)
              return value
          if tool=="vps_status":
              if isinstance(sc,dict):
                  safe={k:sc.get(k) for k in ("host","load_average","uptime_seconds","memory","disk_root") if k in sc}
                  print("tool_execution=PASS")
                  print("response_format=structured")
                  print(json.dumps(safe)[:3000])
              elif texts and any(t.strip() for t in texts):
                  preview=safe_preview("\n".join(texts),1200)
                  print("tool_execution=PASS")
                  print("response_format=text")
                  print("response_chars="+str(sum(len(t) for t in texts)))
                  print("response_preview="+preview)
              else:
                  print("tool_execution=INCONCLUSIVE; successful_http_but_unrecognized_response_shape")
                  print("result_keys="+",".join(sorted(res.keys())))
          elif tool=="list_containers":
              items=None
              if isinstance(sc,list):
                  items=sc
              elif isinstance(sc,dict):
                  for key in ("containers","items","results"):
                      if isinstance(sc.get(key),list):
                          items=sc[key]
                          break
              if items is None and isinstance(parsed_text,list):
                  items=parsed_text
              if isinstance(items,list):
                  safe=[{k:x.get(k) for k in ("name","image","status","health","restart_count") if k in x} for x in items if isinstance(x,dict)]
                  print("tool_execution=PASS")
                  print("response_format=structured")
                  print(json.dumps({"container_count":len(items),"containers":safe})[:6000])
              elif texts and any(t.strip() for t in texts):
                  preview=safe_preview("\n".join(texts),1600)
                  print("tool_execution=PASS")
                  print("response_format=text")
                  print("response_chars="+str(sum(len(t) for t in texts)))
                  print("response_preview="+preview)
              else:
                  print("tool_execution=INCONCLUSIVE; successful_http_but_unrecognized_response_shape")
                  print("result_keys="+",".join(sorted(res.keys())))
          else:
              print("tool_execution=PASS; tool_response_received")
          PY
                    done
                  fi
                fi
                unset token
                rm -f /tmp/vps-mcp-smoke-init-h.txt /tmp/vps-mcp-smoke-init-b.txt /tmp/vps-mcp-smoke-call-h.txt /tmp/vps-mcp-smoke-call-b.txt /tmp/vps-mcp-smoke-request.json
              } > /tmp/vps-admin-result.txt 2>&1
              result="$(cat /tmp/vps-admin-result.txt)"
              ;;
            workspace)
              {
                echo "[repository path]"
                if [ -d "$HOME/Projeto-Absoluto/.git" ]; then
                  git -C "$HOME/Projeto-Absoluto" rev-parse --show-toplevel
                  git -C "$HOME/Projeto-Absoluto" rev-parse --short HEAD
                  git -C "$HOME/Projeto-Absoluto" status --short
                else
                  echo "Repository not present at expected path"
                fi
                echo
                echo "[administration paths]"
                for p in /home/absadmin/actions-runner /home/absadmin/actions-runner-reserve /data/coolify; do
                  if [ -e "$p" ]; then
                    stat -c '%A %U:%G %n' "$p" 2>&1
                  else
                    echo "missing: $p"
                  fi
                done
              } > /tmp/vps-admin-result.txt 2>&1
              result="$(cat /tmp/vps-admin-result.txt)"
              ;;
            *)
              result="Comando não permitido: $command. Use /vps help. Nenhum comando arbitrário é executado."
              ;;
          esac

          echo "command=$command" >> "$GITHUB_OUTPUT"
          {
            echo 'result<<VPS_RESULT_EOF'
            printf '%s\n' "$result"
            echo 'VPS_RESULT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report result
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.command.outputs.result }}
          REQUEST: ${{ github.event.comment.body }}
        with:
          script: |
            const issue_number = context.issue.number || 121;
            const result = process.env.RESULT || '(sem saída)';
            const request = process.env.REQUEST || '';
            const body = [
              '### VPS Admin — canal independente',
              '',
              'COMMAND_MARKER' + request + 'COMMAND_MARKER',
              '',
              'OUTPUT_START',
              result.slice(0, 12000),
              'OUTPUT_END'
            ].join('\\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
