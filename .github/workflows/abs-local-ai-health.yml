name: ABS Local AI Health

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abs-local-ai-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 5
    steps:
      - name: Preflight and single-model smoke test
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/home/absadmin
          available_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          echo "MemAvailable_kB=$available_kb"
          if [ "$available_kb" -lt 1572864 ]; then
            echo "SKIP: less than 1.5 GiB RAM available; no model was started."
            free -h
            exit 0
          fi
          echo "[Ollama models]"
          ollama list
          out="$(curl -fsS --max-time 90 http://127.0.0.1:11434/api/generate -H 'Content-Type: application/json' -d '{"model":"qwen3.5:0.8b","prompt":"Reply exactly LOCAL_AI_OK","stream":false}')"
          echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("response","").strip()=="LOCAL_AI_OK", d; print("ABS_LOCAL_AI_SMOKE_PASS qwen3.5:0.8b")'
          free -h
          df -h /
