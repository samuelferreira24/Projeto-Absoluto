name: ABS Local AI Health

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'abs_core/local_ai_adapter.py'
      - 'abs_core/intelligence.py'
      - 'abs_core/runtime.py'
      - '.github/workflows/abs-local-ai-health.yml'

permissions:
  contents: read

concurrency:
  group: abs-local-ai-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: [self-hosted, abs-vps-01-reserve]
    timeout-minutes: 15
    steps:
      - name: Test all local models
        shell: bash
        run: |
          set -u
          export HOME=/home/absadmin
          failed=0
          for model in qwen3.5:0.8b qwen3.5:2b qwen3.5:4b ministral-3:3b gemma4:e2b gemma4:e4b; do
            out="$(curl -fsS --max-time 180 http://127.0.0.1:11434/api/generate -H 'Content-Type: application/json' -d "{\"model\":\"$model\",\"prompt\":\"Reply exactly LOCAL_AI_OK\",\"stream\":false}")" || { echo "FAIL $model http"; failed=1; continue; }
            if echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("response","").strip()=="LOCAL_AI_OK" else 1)'; then
              echo "PASS $model"
            else
              echo "FAIL $model response"
              failed=1
            fi
          done
          free -h
          df -h /
          if [ "$failed" -ne 0 ]; then exit "$failed"; fi
          echo "ABS_LOCAL_AI_HEALTH_PASS"
