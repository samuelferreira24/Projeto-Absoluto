name: Cérebro — Coleta Contínua

on:
  repository_dispatch:
    types: [memory_capture]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cerebro-coleta-main
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip

      - name: Preparar evento externo
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TYPE: ${{ github.event.action }}
          EVENT_JSON: ${{ toJson(github.event.client_payload) }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p .cerebro/inbox
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ["EVENT_NAME"] != "repository_dispatch":
              raise SystemExit(0)
          payload = json.loads(os.environ.get("EVENT_JSON") or "{}")
          if not payload:
              raise SystemExit("repository_dispatch sem client_payload")
          payload.setdefault("source_type", "API")
          payload.setdefault("source_id", os.environ["REPOSITORY"])
          payload.setdefault("occurred_at", "")
          payload.setdefault("event_type", "mensagem")
          payload.setdefault("content", json.dumps(payload, ensure_ascii=False))
          payload.setdefault("metadata", {})
          payload.setdefault("raw", payload.copy())
          Path(".cerebro/inbox/evento.jsonl").write_text(
              json.dumps(payload, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY

      - name: Processar captura
        run: |
          if [ -f .cerebro/inbox/evento.jsonl ]; then
            python -m cerebro.processar_captura .cerebro/inbox/evento.jsonl
          else
            echo '{"processados":0}'
          fi

      - name: Verificar memória
        run: python -c "from cerebro.servico import Cerebro; print(Cerebro().diagnostico())"

      - name: Persistir memória versionada
        run: |
          if [ -n "$(git status --porcelain -- cerebro/data)" ]; then
            git config user.name "projeto-absoluto-cerebro"
            git config user.email "cerebro@users.noreply.github.com"
            git add cerebro/data
            git commit -m "chore(cerebro): persistir captura automatica"
            git push
          else
            echo "Nenhuma memória nova para persistir."
          fi
